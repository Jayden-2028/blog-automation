, {"t": "p", "lines": ["저희 집이 내린 결론은 단순합니다. 아이를 빠르게 만들 방법은 없습니다.", "제 손에 있는 건 시작 시간뿐입니다.", "그래서 요즘은 나가야 할 시간에서 거꾸로 15분을 당겨 시작합니다. 그 15분이 \"빨리\"를 대신합니다."]}, {"t": "h", "text": "전부 맡기지 말고 마지막 한 동작만 남기세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["다 시키면 늦고, 다 해주면 웁니다. 그 사이에 자리가 하나 있습니다.", "앞의 어려운 부분은 제가 합니다. 마지막 한 동작만 아이 몫으로 남기고요.", "양말이면 발까지 넣어주고 끌어올리는 것만, 외투면 팔을 끼워주고 지퍼만 남깁니다. 아이가 기억하는 건 자기가 끝냈다는 사실입니다."]}, {"t": "p", "lines": ["\"아빠가 여기까지 할게. 지퍼는 지아가.\"", "\"발까지 넣어줄게. 당기는 건 네가 해.\"", "\"마지막은 항상 네 거야.\""]}, {"t": "p", "lines": ["마지막을 남겨두면 다 해줬을 때보다 실랑이가 훨씬 짧아지는 편이에요.", "남길 동작은 매번 같은 걸로 정해둡니다. 오늘은 지퍼, 내일은 단추 식으로 바뀌면 또 처음부터 하겠다고 합니다."]}, {"t": "h", "text": "시간이 없는 날은 그 사실을 먼저 말하세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["급한 날에 말없이 뺏어서 해버리면 아이는 이유를 모릅니다.", "어제는 시켜주고 오늘은 안 시켜주니 규칙이 없는 걸로 받아들이죠.", "그래서 저는 시작하기 전에 오늘이 어떤 날인지 먼저 알려줍니다. 그리고 하나는 꼭 남겨둡니다."]}, {"t": "p", "lines": ["\"오늘은 아빠가 빨리 할게. 대신 신발은 네가 신어.\"", "\"지금은 시간이 없어. 집에 와서 다시 하자.\"", "\"오늘은 아빠 차례, 내일은 네 차례야.\""]}, {"t": "p", "lines": ["미리 말해두면 아이도 그날은 넘어가주는 날이 생깁니다.", "대신 집에 와서 다시 하자고 한 건 꼭 지킵니다. 한 번 어기면 그다음부터는 그 말이 안 통합니다."]}, {"t": "h", "text": "\"빨리\" 대신 얼마나 남았는지 말하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["\"빨리\"는 아이한테 아무 정보가 없는 말입니다.", "얼마나 빨리인지, 어디까지 하면 되는지가 안 들어 있으니까요. 저는 이 말을 하루에 열 번씩 하고 있었습니다.", "남은 개수로 바꾸면 아이도 끝이 보입니다."]}, {"t": "p", "lines": ["\"이제 하나 남았어.\"", "\"양말 두 짝이면 끝이야.\"", "\"이거 신으면 바로 나가는 거야.\""]}, {"t": "p", "lines": ["끝이 보이면 손이 빨라지는 게 눈에 보이기도 합니다.", "저는 이제 현관에서 시계를 안 봅니다. 시계를 보면 그 말이 저도 모르게 다시 나옵니다."]}, {"t": "p", "lines": ["혼자 해보겠다는 말이 반가운 건 시간이 있을 때뿐이잖아요. 그건 저도 인정합니다.", "저희는 외출 전날 밤에 신발이랑 외투를 현관에 미리 꺼내둡니다. 찾는 시간만 줄여도 3분은 벌더군요.", "못 하게 한 날은 집에 와서 한 번 더 기회를 줍니다. 그날 못 한 게 없어지는 건 아니라서요."]}, {"t": "p", "lines": ["저도 아직 늦는 날엔 그냥 신겨버립니다. 그날은 현관에서 한바탕 하고 나가고요.", "15분 앞당기는 것도 매일은 못 합니다. 알면서 못 하는 날이 아직 절반은 됩니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "26개월 내가 할래가 현관에서 시작됩니다.", "01-situation": "양말 한 짝에 3분이 걸립니다. 시계만 봅니다.", "02-child": "혼자 신어보려는 얼굴이 아주 진지합니다.", "03-in 기야?\""]}, {"t": "p", "lines": ["가리킬 수 있는 질문을 받으면 아이가 우는 대신 손가락으로 답하기도 합니다.", "아프다고 하면 그 자리를 손으로 덮어주고 잠깐 기다립니다. 문지르는 것보다 가만히 대고 있는 걸 더 좋아하더군요."]}, {"t": "h", "text": "확인이 끝나면 그 자리를 짧게 끝내세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["다친 데가 없는 걸 확인하고 나서도 계속 붙잡고 있으면 아이는 아직 안 끝났다고 느낍니다.", "걱정을 길게 표현할수록 그 장면이 더 무섭게 기억되더군요.", "확인, 인정, 마무리까지 세 마디면 충분합니다."]}, {"t": "p", "lines": ["\"다친 데 없다. 털고 가자.\"", "\"아팠지. 이제 괜찮아.\"", "\"가서 마저 놀자.\""]}, {"t": "p", "lines": ["짧게 끝내면 같은 자리에서 또 넘어져도 덜 겁내는 편이에요.", "일으켜 세우기보다 스스로 일어날 때까지 손만 내밀고 기다립니다. 그 몇 초가 생각보다 큽니다."]}, {"t": "p", "lines": ["넘어지는 걸 다 막아줄 수는 없잖아요. 그건 걷는 동안 계속 있을 일이고요.", "저희는 저녁마다 걸릴 만한 자리를 한 번 봅니다. 매트 끝, 의자 다리, 문턱 같은 곳입니다.", "넘어졌던 자리를 다시 지날 때는 아무 말도 안 합니다. \"조심해\"를 붙이면 그 자리가 무서운 곳이 됩니다.", "다만 머리를 부딪혔거나 피가 나거나 한참 지나도 계속 울면 그때는 다르게 봅니다. 담담한 반응은 가벼운 일에만 쓰는 겁니다."]}, {"t": "p", "lines": ["요즘 제가 지키는 건 하나입니다.", "넘어지는 소리가 나면 달려가기 전에 숨을 한 번 쉬고 얼굴부터 폅니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "아기 넘어졌을 때 아이는 부모부터 봅니다.", "01-situation": "매트 끝에 걸려 그대로 주저앉았습니다.", "02-child": "울지 않고 아빠 얼굴을 먼저 확인합니다.", "03-interaction": "놀라는 대신 무릎부터 살폈습니다.", "04-recovery": "혼자 일어나서 다시 놀러 갑니다."}, "chars": 1170, "kwn": 1}, {"no": "17", "folder": "17-hitting", "series": "남매둥이 아빠의 오답노트", "pillar": "P3 아이 마음 읽기", "title": "좋다고 달려와 때리는 26개월, 웃어넘기기 전에 정할 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #26개월때리기 #26개월아기 #쌍둥이육아 #아빠육아 #훈육 #두돌아기 #육아꿀팁 #남매둥이", "kw": "26개월 때리기", "q": "26개월 때리기", "a": "좋아서 때린 것도 웃어넘기지 않고, 손을 잡고 마음을 말로 바꿔준 뒤 대신할 동작을 정해줍니다.", "situ": "좋다고 달려와서 아빠를 때립니다", "hook": ["웃어넘기기 전에", "정해야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["지우가 웃으면서 달려오더니 제 팔을 손바닥으로 때렸습니다.", "아프진 않았습니다. 화가 난 것도 아니었습니다.", "좋아서 그런 거였습니다. 표정이 그랬습니다.", "저는 뭐라고 해야 할지 몰라서 같이 웃었습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["26개월 때리기에서 제일 헷갈리는 순간이 이겁니다.", "화나서 때린 게 아닌데 짚고 넘어가야 할까요.", "웃고 넘기자니 습관이 될 것 같고, 정색하자니 좋다고 달려온 아이한테 너무한 것 같습니다.", "그 몇 초를 못 정해서 저는 매번 같이 웃는 쪽으로 갔습니다."]}, {"t": "p", "lines": ["미국 영유아 발달기관 제로투쓰리에 따르면 이 나이 아이들은 생각과 감정을 말보다 행동으로 먼저 내보냅니다.", "화날 때만 그런 게 아닙니다. 반가울 때도 신날 때도 같은 통로로 나옵니다.", "아이한테는 좋아서 때린 것과 화나서 때린 것이 아직 같은 동작입니다."]}, {"t": "h", "text": "말보다 손을 먼저 잡으세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["설명부터 하면 아이는 그 사이에 한 번 더 때립니다.", "말이 끝날 때까지 기다려주지 않으니까요. 동작을 멈추는 게 먼저입니다.", "저는 손목 말고 손바닥을 가볍게 감싸 잡습니다. 붙잡는 느낌보다 받아주는 느낌에 가깝게요."]}, {"t": "p", "lines": ["\"손 잠깐 잡을게.\"", "\"때리는 건 아니야.\"", "\"아빠 안 아파. 그래도 이건 안 하는 거야.\""]}, {"t": "p", "lines": ["동작을 먼저 멈추면 그다음 말이 훨씬 짧아집니다.", "손을 잡을 때 표정은 그대로 둡니다. 정색하면 아이가 왜 잡혔는지보다 혼났다는 것만 남깁니다."]}, {"t": "h", "text": "그 마음을 대신 말해주세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["좋아서 때린 걸 혼내면 아이는 좋았던 것까지 잘못된 걸로 받습니다.", "막을 건 동작입니다. 마음은 그대로 받아줘야 하고요. 26개월은 아직 그 마음에 붙일 단어가 없습니다.", "그래서 제가 대신 말해줍니다. 말이 생기면 손이 덜 나갑니다."]}, {"t": "p", "lines": ["\"아빠 보니까 좋았구나.\"", "\"반가워서 그랬지.\"", "\"좋을 때는 이렇게 말해. 아빠 좋아.\""]}, {"t": "p", "lines": ["자기 기분에 이름이 붙으면 그 말을 먼저 꺼내는 날이 생기기도 해요.", "\"좋아\"라는 말을 지우가 쓰기 시작한 건 그맘때였습니다. 순서가 어느 쪽인지는 저도 모릅니다."]}, {"t": "h", "text": "대신할 동작을 하나 정해주세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["멈추라고만 하면 아이는 갈 곳이 없습니다.", "반가운 마음은 그대로인데 손만 묶어둔 셈이니까요. 같은 자리에 들어갈 다른 동작이 필요합니다.", "저희는 손바닥 마주치기로 정했습니다. 세게 해도 되고 소리도 나는데 아프지 않습니다."]}, {"t": "p", "lines": ["\"좋으면 손바닥 이렇게 마주치자.\"", "\"꽉 안아줘. 그건 괜찮아.\"", "\"세게 하고 싶으면 쿠션에 해.\""]}, {"t": "p", "lines": ["대신할 동작이 정해져 있으면 손이 올라가다 방향을 바꾸기도 합니다.", "동작은 하나만 정합니다. 여러 개를 알려주면 그날 기분에 따라 다시 때리는 쪽으로 돌아갑니다."]}, {"t": "p", "lines": ["처음에 웃어준 게 잘못이었다고는 생각하지 않습니다. 그때는 그게 자연스러웠고요.", "저희는 이제 좋아서 온 거든 화나서 온 거든 손부터 잡습니다. 이유는 그다음에 묻습니다.", "반응은 매번 같게 하려고 합니다. 어제는 웃고 오늘은 정색하면 아이가 제일 헷갈려합니다.", "밖에서 다른 사람을 때렸을 때는 사과를 제가 먼저 합니다. 아이한테 시키는 건 그다음입니다."]}, {"t": "p", "lines": ["때리는 게 줄었다고 말하기엔 아직 이릅니다.", "그래도 요즘은 손을 들었다가 제 얼굴을 한번 보고 멈추는 날이 생겼습니다. 아직 거기까지입니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "26개월 때리기는 화날 때만 나오지 않습니다.", "01-situation": "좋다고 달려오더니 손이 먼저 나갑니다.", "02-child": "아이 얼굴에 반가움이 그대로 올라와 있습니다.", "03-interaction": "웃어주는 대신 손부터 감쌌습니다.", "04-recovery": "손바닥 마주치기로 자리를 바꿨습니다."}, "chars": 1149, "kwn": 1}, {"no": "16", "folder": "16-name-calling", "series": "남매둥이 아빠의 오답노트", "pillar": "P2 남매둥이라서", "title": "한 명만 달려오는 쌍둥이 이름 부르기, 두 번 부르기 전에 바꿀 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #쌍둥이이름부르기 #26개월아기 #쌍둥이육아 #아빠육아 #육아꿀팁 #두돌아기 #전환시간 #남매둥이", "kw": "쌍둥이 이름 부르기", "q": "쌍둥이 이름 부르기", "a": "둘을 묶어 부르는 대신 이름을 하나씩 부르고, 넘어올 시간을 아이마다 따로 줍니다.", "situ": "\"얘들아\" 불렀는데 한 명만 옵니다", "hook": ["두 번 부르기 전에", "바꿔야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["저녁 6시, 밥 먹자고 불렀습니다.", "\"얘들아, 밥 먹자.\"", "지아는 바로 일어나서 식탁으로 달려왔습니다.", "지우는 하던 블록을 계속 만졌습니다. 고개도 안 들었습니다.", "같은 말을 같은 목소리로 했는데 반응이 완전히 달랐습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["쌍둥이 이름 부르기 문제는 하루에도 몇 번씩 옵니다.", "등원 준비할 때, 밥 먹을 때, 씻을 때, 나갈 때.", "부를 일이 하루에 열 번쯤 되는데 매번 한 명만 옵니다.", "안 오는 아이한테 다시 가서 말하다 보면 두 번 부르는 게 기본이 되죠."]}, {"t": "p", "lines": ["저는 한동안 지우가 말을 덜 듣는다고 생각했습니다."]}, {"t": "p", "lines": ["미국 보건복지부의 영유아 프로그램 헤드스타트에 따르면 이 나이 아이들은 하던 일에서 다음 일로 넘어가는 것 자체를 아직 배우는 중입니다.", "그래서 옮겨 갈 시간을 미리 알려주라고 합니다. 그 시간은 아이마다 따로 잡아주고요.", "반응이 느린 게 아니라 넘어오는 데 걸리는 시간이 다른 겁니다."]}, {"t": "h", "text": "둘을 묶지 말고 이름을 하나씩 부르세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["\"얘들아\"는 26개월한테 누구 말인지 안 잡힙니다.", "둘 다 들었는데 둘 다 자기 말이라고 확신하지 못하는 상태가 됩니다.", "그래서 저는 이름을 하나씩, 사이를 두고 부릅니다. 한 번에 두 이름을 붙여 부르지도 않습니다."]}, {"t": "p", "lines": ["\"지우야. 아빠 봐.\"", "\"지아야. 그다음은 지아 차례야.\"", "\"지우 이름 불렀어. 지우한테 하는 말이야.\""]}, {"t": "p", "lines": ["이름으로 부르면 두 번 부를 일이 눈에 띄게 줄어드는 편이에요.", "둘을 같이 불러야 할 때는 이름을 먼저 붙입니다. \"지우 지아, 밥 먹자\"처럼요."]}, {"t": "h", "text": "부르기 전에 끝낼 시간을 먼저 주세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["지우가 안 오는 건 놀이가 아직 안 끝났기 때문입니다.", "어른도 하던 일을 딱 멈추고 일어나기는 어렵잖아요. 26개월은 더 그렇습니다.", "그래서 부르기 전에 끝날 지점을 먼저 정해줍니다. 시간보다 개수나 노래처럼 눈에 보이는 걸로 주는 게 낫습니다."]}, {"t": "p", "lines": ["\"블록 세 개만 더 놓고 오자.\"", "\"이 노래 끝나면 밥이야.\"", "\"아빠 한 번 더 부르면 그때 가는 거야.\""]}, {"t": "p", "lines": ["예고를 받으면 부를 때 바로 일어나는 날이 조금씩 생깁니다.", "예고한 시점이 왔는데 안 오면 그때는 다시 설명하지 않습니다. 말한 대로만 합니다."]}, {"t": "h", "text": "먼저 온 아이를 붙잡아두지 마세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["제가 오래 잘못한 게 이겁니다. 둘이 다 올 때까지 시작을 안 했습니다.", "먼저 온 지아는 그동안 기다리다가 다시 놀러 가버립니다. 결국 둘 다 없는 식탁에 저만 앉아 있게 됩니다.", "온 아이는 그 자리에서 바로 시작시킵니다."]}, {"t": "p", "lines": ["\"지아는 먼저 앉아서 시작하자.\"", "\"지우는 오는 중이야.\"", "\"먼저 온 사람이 먼저 먹는 거야.\""]}, {"t": "p", "lines": ["먼저 시작한 아이를 보고 나머지 한 명이 따라오는 경우도 꽤 있어요.", "빨리 온 아이를 기다리게 하면 다음부터는 그 아이도 안 옵니다. 그게 제일 아까운 손해였습니다."]}, {"t": "p", "lines": ["같은 말에 다르게 반응하는 게 애정 차이는 아니잖아요.", "저희는 급할 때 아예 두 명 순서를 정해두고 부릅니다. 느린 아이를 먼저 부르고 빠른 아이를 나중에 부르면 둘이 비슷하게 도착합니다.", "빨리 오는 아이한테 고맙다는 말을 빼먹지 않으려고 합니다. 당연해지면 그것도 서운한 일이더군요."]}, {"t": "p", "lines": ["저희 집 규칙은 한 줄입니다.", "부를 때는 이름을 하나씩, 기다릴 때는 시간을 따로 줍니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "쌍둥이 이름 부르기에 한 명만 달려옵니다.", "01-situation": "부르는 소리에 한 명은 오고 한 명은 남습니다.", "02-child": "블록을 쌓던 아이는 고개도 들지 않습니다.", "03-interaction": "크게 부르는 대신 옆에 가서 이름을 불렀습니다.", "04-recovery": "결국 둘 다 식탁에 앉아 밥을 먹습니다."}, "chars": 1136, "kwn": 1}, {"no": "15", "folder": "15-twin-jealousy", "series": "남매둥이 아빠의 오답노트", "pillar": "", "title": "전부 \"내 거\"라고 하는 쌍둥이 질투, 똑같이 두 개 주기 전에 해줄 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #쌍둥이질투 #26개월아기 #쌍둥이육아 #아빠육아 #소유욕 #두돌아기 #육아꿀팁 #남매둥이", "kw": "쌍둥이 질투", "q": "쌍둥이 질투", "a": "똑같이 두 개씩 주는 대신 물건마다 주인을 말로 붙여주고, 이름을 먼저 부릅니다.", "situ": "이제 전부 \"내 거\"라고 합니다", "hook": ["두 개 사기 전에", "해줘야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["\"내 거!\"", "지아가 지우 손에 있던 컵을 잡으면서 그랬습니다.", "얼마 전까지는 \"지아 거\"라고 말했는데 요즘은 전부 \"내 거\"입니다.", "제가 지우 머리를 만져주고 있으면 그것도 \"내 거\"라고 합니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["쌍둥이 질투는 물건에서 끝나지 않습니다.", "뭘 하나 사면 두 개를 사야 하고 다른 걸 주면 서로 바꿔달라고 합니다.", "한 명을 안고 있으면 나머지 한 명이 그 팔을 끌어내립니다.", "공평하게 해보려고 애쓸수록 비교할 거리만 늘어나는 느낌이었습니다."]}, {"t": "p", "lines": ["미국의 발달심리학자 라렌 파시그는 두 돌 무렵 \"내 거\"라는 말이 늘어나는 걸 소유욕보다 자기 개념이 생기는 신호로 봤습니다.", "가진 걸 지키려는 게 아니라, \"나\"라는 게 어디까지인지를 물건으로 표시해보는 단계라는 겁니다.", "그래서 뺏어서 나눠주면 아이는 물건보다 자기 자리를 뺏긴 것처럼 반응합니다."]}, {"t": "h", "text": "물건마다 주인을 말로 붙여주세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["저희 집이 제일 먼저 바꾼 건 호칭이었습니다.", "컵도 수건도 의자도 \"이건 지우 거, 이건 지아 거\"라고 매번 소리 내어 말합니다.", "자기 것이 확실해지면 남의 것도 같이 보입니다. 순서가 반대인 줄 알았는데 아니더군요."]}, {"t": "p", "lines": ["\"이건 지우 컵, 이건 지아 컵.\"", "\"지아 거 여기 있어. 안 없어졌어.\"", "\"네 거는 아빠가 지켜줄게.\""]}, {"t": "p", "lines": ["주인이 정해져 있으면 남의 걸 잡는 횟수가 눈에 띄게 줄어드는 편이에요."]}, {"t": "h", "text": "\"나도\"가 나오면 물건 말고 아이를 부르세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["제일 자주 오는 질투는 물건이 아니라 저를 두고 벌어집니다.", "제가 한 명을 안거나 머리를 만져주면 바로 \"나도\"가 나옵니다. 이때 똑같은 걸 서둘러 해주면 아이는 물건처럼 셈을 하기 시작합니다.", "저는 이럴 때 물건이나 동작 대신 아이 이름부터 부릅니다. 지금 내가 너를 보고 있다는 걸 먼저 알려주는 겁니다."]}, {"t": "p", "lines": ["\"지아야, 아빠 지금 지아 보고 있어.\"", "\"지아 머리도 이따 만져줄게. 지금은 지우 차례.\"", "\"이리 와. 여기 앉아서 같이 보자.\""]}, {"t": "p", "lines": ["이름을 먼저 부르면 \"나도\"가 울음까지 가지 않고 멈추는 날도 있어요."]}, {"t": "h", "text": "빌려주는 연습은 부모하고 먼저 하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["26개월끼리 빌려주기는 아직 어렵습니다.", "손에서 떠나면 영영 없어지는 걸로 느끼니까요. 그래서 저는 저랑 먼저 연습합니다.", "제 물건을 빌려주고 아이 앞에서 돌려받습니다. 빌려준 게 돌아온다는 걸 눈으로 보게 하는 게 먼저입니다."]}, {"t": "p", "lines": ["\"아빠 거 빌려줄게. 다 쓰면 돌려줘.\"", "\"봐, 돌려받았지.\"", "\"빌려준 건 없어지는 거 아니야.\""]}, {"t": "p", "lines": ["이 연습이 쌓이면 서로한테 건네보는 날도 생길 수 있어요.", "돌려받는 장면을 여러 번 보여주는 게 빌려주라고 말하는 것보다 빨랐습니다."]}, {"t": "p", "lines": ["\"내 거\"라는 말이 늘었다는 건 자기를 알아가고 있다는 뜻이잖아요. 그 자체가 나쁜 신호는 아닙니다.", "저희는 새로 사는 물건은 색을 다르게 삽니다. 똑같은 두 개를 사두면 결국 서로 상대 걸 원하게 되더군요.", "각자 물건을 두는 자리도 따로 정해뒀습니다. 자기 칸이 있으면 남의 칸에 손을 덜 댑니다.", "쌍둥이 질투가 심한 날은 둘을 떼어놓기보다 각자 자리를 넓혀줍니다."]}, {"t": "p", "lines": ["저도 아직 둘이 동시에 \"내 거\" 하면 제일 빠른 길로 갑니다. 똑같은 걸 하나 더 꺼내옵니다.", "그렇게 넘긴 날은 다음 날부터 두 개가 기본이 됩니다. 알면서도 그날은 그게 제일 빠릅니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "쌍둥이 질투는 이제 물건에서 끝나지 않습니다.", "01-situation": "한 아이가 다른 아이 손의 컵을 잡습니다.", "02-child": "컵을 꼭 쥐고 자기 거라고 말합니다.", "03-interaction": "똑같이 주는 대신 주인을 먼저 붙였습니다.", "04-recovery": "각자 자기 컵을 들고 나란히 앉았습니다."}, "chars": 1162, "kwn": 2}, {"no": "14", "folder": "14-throwing-things", "series": "남매둥이 아빠의 오답노트", "pillar": "", "title": "비거리가 늘어난 26개월 물건 던지기, \"안 돼\"보다 먼저 정할 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #26개월물건던지기 #26개월아기 #쌍둥이육아 #아빠육아 #훈육 #두돌아기 #육아꿀팁 #남매둥이", "kw": "26개월 물건 던지기", "q": "26개월 물건 던지기", "a": "던지는 걸 막기 전에 던져도 되는 물건과 던지는 자리를 먼저 만들어줍니다.", "situ": "거실 끝까지 자동차가 날아갑니다", "hook": ["\"안 돼\"보다 먼저", "정해야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["거실 끝까지 자동차가 날아갔습니다.", "소파 팔걸이에 맞고 떨어졌고 지우는 그걸 보더니 웃었습니다.", "지난달만 해도 발 앞에 툭 떨어지던 거였습니다.", "힘이 붙으면서 비거리가 늘었습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["26개월 물건 던지기는 어디까지가 놀이고 어디부터 훈육일까요.", "크는 과정이니까 두자니 유리컵 쪽으로 날아가는 날이 있고,", "그때마다 막자니 하루에 열 번씩 \"안 돼\"만 하게 됩니다."]}, {"t": "p", "lines": ["미국소아과학회(AAP)에 따르면 두 살은 한계를 시험하는 시기입니다.", "자기 몸의 한계, 부모의 한계, 주변 환경의 한계를 한꺼번에 시험한다고 합니다.", "던지기는 그걸 몸으로 해보는 방법입니다. 얼마나 멀리 가는지와 어디까지 봐주는지를 같이 확인하는 셈입니다."]}, {"t": "h", "text": "던져도 되는 물건을 먼저 정해두세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["\"던지지 마\"만 반복하면 아이는 뭘 해야 할지 모릅니다.", "던지고 싶은 마음은 그대로인데 출구만 막힌 상태가 되니까요.", "저희 집은 던져도 되는 물건을 세 개 정해뒀습니다. 공, 인형, 빨래입니다. 나머지는 굴리거나 내려놓는 거라고 알려줍니다."]}, {"t": "p", "lines": ["\"이건 던져도 돼. 공은 괜찮아.\"", "\"자동차는 굴리는 거야.\"", "\"던지고 싶으면 아빠가 공 가져올게.\""]}, {"t": "p", "lines": ["던져도 되는 걸 손에 쥐여주면 나머지를 내려놓는 날이 생각보다 빨리 오기도 합니다.", "세 개가 너무 적어 보여도 늘리지는 않았습니다. 목록이 길어지면 아이도 저도 헷갈립니다."]}, {"t": "h", "text": "던지는 자리를 만들어주세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["물건보다 중요한 게 방향입니다.", "아무 데나 던지면 그건 계속 사고 직전까지 갑니다. 목표가 생기면 같은 동작이 놀이가 됩니다.", "저희는 거실 한쪽에 빨래통을 놓고 거기까지만 던지기로 했습니다. 26개월은 아직 잘 못 넣는데 넣으려고 하는 것만으로도 팔이 조준을 배웁니다."]}, {"t": "p", "lines": ["\"여기 안으로 넣어보자.\"", "\"빨래통까지 던져볼래?\"", "\"저기까지만 가는 거야.\""]}, {"t": "p", "lines": ["자리를 정해두면 던지는 횟수는 그대로여도 물건이 깨질 일은 줄어듭니다.", "넣으면 같이 박수를 칩니다. 그게 던지는 것보다 재밌어지면 그날은 수월하게 지나갑니다."]}, {"t": "h", "text": "던진 건 아이가 주워오게 하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["제가 제일 오래 잘못한 부분이 이겁니다. 던지면 제가 주워왔습니다.", "아이 입장에서는 던지는 게 끝이 아니라 시작이 됩니다. 던지면 아빠가 움직이니까요.", "힘들어도 아이가 가져오게 둡니다. 안 가져오면 그 놀이는 거기서 끝냅니다."]}, {"t": "p", "lines": ["\"던진 건 지우가 가져와.\"", "\"가져오면 한 번 더 할 수 있어.\"", "\"안 가져오면 오늘은 여기까지야.\""]}, {"t": "p", "lines": ["주워오는 게 놀이에 포함되면 한 번 던지기 전에 한 번 생각하게 되는 것 같더군요.", "처음 며칠은 제가 주워오고 싶어서 손이 먼저 나갔습니다. 그 손만 참으면 되는 일이었습니다."]}, {"t": "p", "lines": ["던지는 힘이 세졌다는 건 그만큼 컸다는 뜻이잖아요. 그 자체를 막을 수는 없습니다.", "저희는 소파 주변에서 깨질 만한 걸 아예 치웠습니다. 물건이 없으면 혼낼 일도 같이 없어지더군요.", "사람이나 얼굴 쪽으로 던졌을 때만 저도 단호하게 끊습니다. 그때는 놀이를 그 자리에서 정리합니다."]}, {"t": "p", "lines": ["요즘은 지우가 자동차를 던지려다 멈추고 공을 찾으러 갑니다.", "찾으러 가는 동안 던지고 싶은 마음이 반쯤 식는 것 같기도 합니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "26개월 물건 던지기는 비거리가 계속 늘어납니다.", "01-situation": "장난감 자동차가 거실 끝까지 날아갔습니다.", "02-child": "던지기 직전 팔이 뒤로 크게 젖혀집니다.", "03-interaction": "막는 대신 던져도 되는 걸 쥐여줬습니다.", "04-recovery": "바구니에 들어가면 같이 박수를 칩니다."}, "chars": 1132, "kwn": 1}, {"no": "13", "folder": "13-both-crying", "series": "남매둥이 아빠의 오답노트", "pillar": "", "title": "싸우다 쌍둥이 동시에 울 때, 억울한 쪽을 먼저 안기 전에 볼 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #쌍둥이동시에울때 #26개월아기 #쌍둥이육아 #아빠육아 #형제싸움 #두돌아기 #육아꿀팁 #남매둥이", "kw": "쌍둥이 동시에 울 때", "q": "쌍둥이 동시에 울 때", "a": "억울한 쪽을 가리기 전에, 더 빨리 그칠 아이를 먼저 안아 한 명씩 끝냅니다.", "situ": "싸우다 둘이 동시에 울기 시작합니다", "hook": ["누굴 먼저 안을지", "정하는 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["지우가 지아 손에 있던 블록을 잡아당겼습니다.", "지아가 안 놓으니까 지우가 먼저 울었고 반 박자 뒤에 지아도 울기 시작했습니다.", "저는 두 팔을 벌린 채로 그 앞에 서 있었습니다.", "누구부터 안아야 할지 정하는 그 3초가 제일 어렵습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["쌍둥이 동시에 울 때는 억울한 쪽을 먼저 안아야 한다고 생각하기 쉽습니다.", "저도 한동안 누가 먼저 뺏었는지부터 확인했습니다.", "그런데 확인하는 동안 둘 다 더 크게 울었습니다. 판정이 끝나기 전에 상황이 더 나빠지더군요."]}, {"t": "p", "lines": ["저희 집은 그래서 기준을 회복 속도 쪽으로 옮겼습니다.", "둘을 동시에 달래려고 하면 결국 둘 다 길어집니다. 어른 몸은 한 번에 한 명한테만 붙어 있을 수 있으니까요.", "빨리 그치는 아이를 먼저 안습니다. 그 아이가 가라앉으면 나머지 한 명한테 온전히 붙습니다."]}, {"t": "h", "text": "먼저 그칠 아이를 먼저 안으세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["누가 더 크게 우는지는 기준이 못 됩니다.", "저희 집은 지우가 소리는 큰데 빨리 그치고 지아는 조용히 오래 웁니다.", "지우를 먼저 안으면 30초면 끝나고 그 뒤로 지아한테 붙어 있을 수 있습니다. 순서를 바꾸면 둘 다 5분이 넘어갑니다.", "안을 아이를 정했으면 나머지 한 명한테 다음이라는 걸 말로 알려줍니다."]}, {"t": "p", "lines": ["\"지우 먼저 안을게. 지아 차례는 바로 와.\"", "\"아빠 여기 있어. 안 나가.\"", "\"둘 다 안을 거야. 순서만 있는 거야.\""]}, {"t": "p", "lines": ["먼저 그칠 아이부터 안으면 우는 시간 자체가 전체적으로 짧아지는 편이에요.", "누가 빨리 그치는지는 며칠만 지켜보면 집집마다 답이 나옵니다."]}, {"t": "h", "text": "기다리는 아이 이름을 계속 부르세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["힘든 쪽은 기다리는 아이입니다.", "26개월한테 기다리라는 말만 주면 그 말은 순서로 안 들립니다. 그냥 거절로 들립니다.", "그래서 저는 한 명을 안고 있는 동안 나머지 한 명 이름을 계속 부릅니다. 눈을 맞추고, 이름을 부르고, 뭘 하고 있는지 말해줍니다."]}, {"t": "p", "lines": ["\"지아야, 아빠 여기 있어.\"", "\"지아 우는 거 아빠 다 듣고 있어.\"", "\"지우 다 되면 바로 지아야.\""]}, {"t": "p", "lines": ["이름이 계속 들리면 기다리는 쪽이 생각보다 덜 무너지기도 합니다.", "안고 있는 아이한테도 지금 동생 이름을 부르고 있다는 게 같이 들립니다. 그것도 나쁘지 않더군요."]}, {"t": "h", "text": "다 그친 다음에 한 번만 짚어주세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["우는 중에 하는 훈육은 거의 전달이 안 됩니다.", "저는 예전에 우는 애를 안고 \"왜 뺏었어\"부터 물었는데 그 말이 들어간 적이 없습니다.", "둘 다 조용해지고 나서 짧게 한 번만 짚습니다. 길게 하면 방금 끝난 울음이 다시 시작됩니다."]}, {"t": "p", "lines": ["\"아까 블록 뺏었지. 다음엔 아빠 불러.\"", "\"둘 다 울었으니까 둘 다 미안해도 돼.\"", "\"이제 같이 하자.\""]}, {"t": "p", "lines": ["다 그친 뒤에 말하면 아이가 그 말을 기억하는 확률이 확실히 올라갑니다.", "한 문장이면 충분합니다. 길어지면 짚는 게 혼내는 쪽으로 넘어갑니다."]}, {"t": "p", "lines": ["싸움이 났을 때 제일 먼저 정리해야 할 건 소리입니다. 잘잘못은 그다음에도 늦지 않습니다.", "저희는 둘이 붙어서 울면 일단 블록이든 뭐든 그 물건을 제가 들고 있습니다. 물건이 바닥에 있으면 울면서도 계속 손이 갑니다.", "저도 아직 3초 안에 못 고르는 날이 있습니다."]}, {"t": "p", "lines": ["저희 집 기준은 한 줄입니다.", "더 크게 우는 아이가 아니라, 더 빨리 그칠 아이부터 안습니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "쌍둥이 동시에 울 때 그 3초가 제일 어렵습니다.", "01-situation": "블록 하나에 두 아이 손이 같이 갔습니다.", "02-child": "둘 다 속상한데 가라앉는 속도가 다릅니다.", "03-interaction": "둘 다 안는 대신 이름을 계속 불렀습니다.", "04-recovery": "다 그친 뒤에야 블록을 같이 쌓습니다."}, "chars": 1131, "kwn": 1}, {"no": "12", "folder": "12-saying-no", "series": "남매둥이 아빠의 오답노트", "pillar": "", "title": "하루 스무 번 나오는 26개월 싫어, 대안을 주기 전에 바꿀 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #26개월싫어 #26개월아기 #쌍둥이육아 #아빠육아 #육아꿀팁 #두돌아기 #자율성 #남매둥이", "kw": "26개월 싫어", "q": "26개월 싫어", "a": "선택지를 늘리는 대신 두 개에서 멈추고, 물어볼 일과 알려줄 일을 나눕니다.", "situ": "뭘 내밀어도 싫다고 합니다", "hook": ["대안을 주기 전에", "바꿔야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["요즘 저희 집 아침은 \"싫어\"로 시작합니다.", "옷을 들면 싫어, 다른 옷을 들어도 싫어.", "\"그럼 지아가 골라\" 하면 그것도 싫다고 합니다.", "고른 옷이 문제가 아닌 날이 분명히 있습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["26개월 싫어는 하루에 스무 번쯤 나옵니다.", "선택지를 주라는 말은 저도 많이 들었는데 저희 집은 그 선택지까지 싫다고 합니다.", "두 개를 내밀면 세 번째를 달라고 하고 세 번째를 꺼내면 다시 처음 걸 달라고 하죠."]}, {"t": "p", "lines": ["에릭슨은 18개월에서 36개월 사이를 아이가 자율성을 세우는 시기로 봤습니다.", "이때 아이가 확인하고 싶은 건 무엇을 갖느냐보다 그걸 자기가 정했느냐입니다.", "그래서 선택지를 늘려도 잘 안 통합니다. 정하는 사람이 여전히 저였으니까요."]}, {"t": "h", "text": "선택지는 두 개까지만 꺼내세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["세 번째를 꺼내는 순간 그건 선택이 아니라 협상이 됩니다.", "저는 한동안 계속 꺼냈습니다. 노란 옷, 파란 옷, 그래도 안 되면 어제 입던 옷까지요.", "꺼낼수록 아이는 더 고를 게 남았다고 생각합니다. 두 개에서 멈추는 게 낫습니다.", "안 고르면 제가 고르겠다는 것까지 말해줍니다."]}, {"t": "p", "lines": ["\"이거 아니면 이거야.\"", "\"지금 안 고르면 아빠가 골라.\"", "\"고르고 싶어지면 말해.\""]}, {"t": "p", "lines": ["두 개에서 멈추면 고민하는 시간 자체가 짧아지기도 합니다.", "고른 다음에 마음이 바뀌어도 그날은 바꿔주지 않습니다. 바꿔주면 고르는 일 자체가 의미를 잃더군요."]}, {"t": "h", "text": "거절할 수 있는 일과 없는 일을 말투로 구분하세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["제가 자주 하던 실수는 안 되는 일까지 물어본 겁니다.", "\"카시트 탈까?\"라고 물으면 아이한테는 안 타도 되는 선택지가 생깁니다.", "안전이나 위생처럼 거절이 안 되는 일은 묻지 않고 알려줍니다. 대신 그 안에서 작은 걸 고르게 둡니다."]}, {"t": "p", "lines": ["\"카시트 앉자. 노래는 지아가 골라.\"", "\"손은 씻는 거야. 물 온도만 골라.\"", "\"이건 안 물어봤어. 같이 하자.\""]}, {"t": "p", "lines": ["물어보는 일과 알려주는 일이 나뉘면 \"싫어\"가 나오는 자리도 같이 줄어듭니다.", "저는 하루에 몇 번이나 아이한테 물어보는지를 한번 세어봤습니다. 안 물어봐도 될 걸 물어본 게 절반이 넘었습니다."]}, {"t": "h", "text": "\"싫어\" 다음에 나올 말을 기다려주세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["26개월한테 \"싫어\"는 아직 제일 쉬운 단어입니다.", "불편한데 뭐라고 해야 할지 모를 때도 일단 그 말이 먼저 나옵니다.", "그래서 \"싫어\"를 바로 막으면 그다음에 나올 말까지 같이 막힙니다. 저는 한 박자 기다리기로 했습니다."]}, {"t": "p", "lines": ["\"싫구나. 뭐가 싫은지 알려줘.\"", "\"아빠 기다릴게.\"", "\"말 나올 때까지 여기 있을게.\""]}, {"t": "p", "lines": ["기다리다 보면 \"추워\", \"아파\" 같은 다른 단어가 뒤늦게 나오는 날도 있어요.", "그런 날은 싫다고 한 이유가 옷이 아니었던 겁니다."]}, {"t": "p", "lines": ["하루에 스무 번 듣다 보면 이게 언제 끝나나 싶잖아요.", "저희는 아침에 입을 옷을 전날 저녁에 같이 골라둡니다. 아침에 고르면 시간에 쫓겨서 제가 먼저 조급해지더군요.", "하루 종일 싫다고만 하는 날은 컨디션부터 봅니다. 잠이 모자란 날은 뭘 내밀어도 안 통합니다.", "\"싫어\"가 줄기를 기다리기보다 제가 물어보는 횟수를 줄이는 쪽이 훨씬 빨랐습니다.", "안 되는 일을 물어보지 않기까지는 저도 시간이 좀 걸렸습니다."]}, {"t": "p", "lines": ["아직 아침은 \"싫어\"로 시작합니다.", "달라진 건 그다음이 조금 빨라졌다는 정도입니다. 아직 거기까지입니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "26개월 싫어가 하루에 스무 번씩 나옵니다.", "01-situation": "아빠가 옷 두 벌만 들고 기다립니다.", "02-child": "다문 입에 오늘도 안 고르겠다고 적혀 있습니다.", "03-interaction": "더 꺼내는 대신 두 벌만 남겨뒀습니다.", "04-recovery": "스스로 고른 옷을 들고 환하게 웃습니다."}, "chars": 1165, "kwn": 1}, {"no": "11", "folder": "11-parent-emotion", "series": "남매둥이 아빠의 오답노트", "pillar": "", "title": "보채는 아이한테 언성이 올라간 날, 참기보다 먼저 할 육아 감정조절 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #육아감정조절 #26개월아기 #쌍둥이육아 #아빠육아 #육아스트레스 #두돌아기 #육아일기 #전업아빠", "kw": "육아 감정조절", "q": "육아 감정조절", "a": "아이를 조용히 시키려 하기 전에, 올라오는 신호를 먼저 잡고 그날 할 일을 줄입니다.", "situ": "아내가 아픈 날, 제가 먼저 언성을 높였습니다", "hook": ["참기 전에", "바꿔야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["며칠 전 오후였습니다.", "아내가 머리가 아프다며 방에 잠깐 누웠습니다.", "하필 그날따라 둘 다 아침부터 계속 보챘습니다.", "저는 결국 거실에서 언성을 높였습니다.", "아이들은 제가 무슨 말을 했는지보다 목소리가 커진 것에 먼저 놀랐습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["육아 감정조절이 제일 안 되는 날은 아이가 유난한 날이 아니었습니다.", "집에 아픈 사람이 있거나 제 컨디션이 바닥인 날이었습니다.", "그런 날은 평소에 그냥 넘어가던 일이 하나하나 다 걸립니다.", "참아야 한다는 건 아는데 참는 것만으로는 안 되더군요."]}, {"t": "p", "lines": ["지나고 보니 그날 순서가 잘못돼 있었습니다."]}, {"t": "p", "lines": ["26개월은 아직 혼자 진정하지 못합니다.", "미국 영유아 발달기관 제로투쓰리(ZERO TO THREE)에 따르면 이 나이 아이들은 어른의 차분함을 빌려 쓰면서 스스로 가라앉는 법을 배웁니다.", "빌려줄 차분함이 저한테 없던 날이었으니, 아이들이 기댈 데도 같이 없어진 셈입니다.", "그날 제가 해야 했던 건 아이를 조용히 시키는 일이 아니라 제 목소리를 먼저 낮추는 일이었습니다."]}, {"t": "h", "text": "올라오는 신호를 몸에서 먼저 잡으세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["소리를 지르기 직전에 저한테 나타나는 신호가 몇 개 있습니다.", "말이 빨라지고, 숨이 짧아지고, 아이 이름을 두 번 연달아 부릅니다.", "이 신호는 늘 같은 순서로 옵니다. 저는 세 번째까지 가서야 알아챘습니다. 그때는 이미 늦었고요.", "요즘은 두 번째에서 말을 끊으려고 합니다."]}, {"t": "p", "lines": ["\"아빠 잠깐 물 마시고 올게.\"", "\"아빠 지금 목소리 커졌지. 다시 말할게.\"", "\"잠깐만 앉았다 하자.\""]}, {"t": "p", "lines": ["신호를 이름 붙여두면 올라오는 걸 알아채는 시점이 조금씩 앞당겨지는 편이에요."]}, {"t": "h", "text": "아픈 사람이 있는 날은 하루 순서를 줄이세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["그날 제가 붙잡고 있던 건 평소랑 똑같은 일과였습니다.", "저녁 먹이고, 씻기고, 책 읽고, 재우고. 아내가 누워 있는데도 그걸 다 하려고 했습니다.", "아픈 사람이 있는 날은 사람이 하나 줄어든 날입니다. 일도 같이 줄여야 맞습니다.", "저는 이제 그런 날 아침에 뭘 뺄지 먼저 정합니다."]}, {"t": "p", "lines": ["\"오늘은 목욕 안 해. 물수건으로 닦자.\"", "\"책은 한 권만 읽을 거야.\"", "\"오늘 저녁은 여기까지만 하자.\""]}, {"t": "p", "lines": ["하나를 빼두면 나머지에서 목소리가 올라갈 일이 확실히 줄어듭니다."]}, {"t": "h", "text": "언성을 높였으면 그 자리에서 짧게 정리하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["소리를 지른 다음이 더 중요합니다.", "저는 한동안 미안한 마음에 그 뒤로 뭐든 다 들어줬습니다. 아이는 그걸 사과로 못 읽습니다.", "길게 설명하지 말고 짧게 인정하고 넘어가는 게 낫습니다. 26개월이 알아들을 수 있는 길이는 한 문장 정도입니다."]}, {"t": "p", "lines": ["\"아빠가 아까 크게 말했어. 미안해.\"", "\"지우가 잘못한 거 아니야.\"", "\"다시 말할게. 이리 와볼래?\""]}, {"t": "p", "lines": ["짧게 정리하고 나면 아이도 그 상황을 그 자리에서 끝난 일로 넘기는 것 같더군요."]}, {"t": "p", "lines": ["소리를 지르고 나면 제일 오래 남는 건 아이 표정입니다.", "저희는 아픈 사람이 있는 날 저녁 순서를 미리 줄여둡니다. 그날 안 해도 되는 걸 아침에 하나 정해두고요.", "육아 감정조절은 저한테 참는 기술보다 자리를 옮기는 기술에 가까웠습니다."]}, {"t": "p", "lines": ["요즘 제가 지키는 건 하나입니다.", "목소리가 커지려고 하면 하던 말을 멈추고 부엌까지 갔다 옵니다. 열 걸음쯤 됩니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "육아 감정조절이 제일 안 되는 날의 저녁입니다.", "01-situation": "굳어진 아빠 표정을 아이 둘이 올려다봅니다.", "02-child": "목소리가 커지자 아이가 먼저 놀랍니다.", "03-interaction": "더 말하는 대신 눈높이를 먼저 맞췄습니다.", "04-recovery": "짧게 정리하고 나면 저녁이 다시 조용해집니다."}, "chars": 1138, "kwn": 2}, {"no": "10", "folder": "10-joke-deflection", "series": "남매둥이 아빠의 오답노트", "pillar": "P3 아이 마음 읽기", "title": "안 된다고 하면 말장난으로 넘기는 아이, 웃기 전에 정해야 할 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #26개월훈육 #26개월아기 #쌍둥이육아 #아빠육아 #유아훈육 #육아꿀팁 #두돌아기 #언어발달", "kw": "26개월 훈육", "q": "26개월 훈육", "a": "말솜씨는 그 자리를 벗어난 뒤에 칭찬하고, 그 순간에는 같은 문장으로 규칙 하나만 반복합니다.", "situ": "\"안 돼\"라고 하면 바로 말꼬리를 잡습니다", "hook": ["웃기 전에", "정해야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["\"지아, 그건 안 돼.\"", "제가 말하자 지아가 저를 빤히 보더니 대답했습니다."]}, {"t": "p", "lines": ["\"안 돼? 안 대? 대!\"", "그러고는 자기가 한 말이 웃겼는지 깔깔 웃었습니다.", "저는 그 자리에서 아무 말도 못 하고 지아를 보고만 있었습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["26개월 훈육에서 제일 난감한 순간이 이겁니다.", "웃어줘야 할까요, 짚고 넘어가야 할까요.", "말이 늘어난 건 기특한데 하려던 말은 흐려집니다. 그렇다고 이 나이에 저게 혼날 일인가 싶기도 하고요.", "그 몇 초 고민하는 사이 아이는 이미 다른 놀이로 넘어가 있습니다."]}, {"t": "p", "lines": ["제가 멈춘 이유는 하나였습니다. 칭찬할지 짚을지를 못 정했습니다."]}, {"t": "p", "lines": ["26개월은 감정을 느끼는 능력이 그 감정을 조절하는 능력보다 앞서 있는 시기입니다.", "진지한 분위기를 그대로 견디기가 아직 어렵습니다.", "말장난은 부모를 무시해서 나오는 게 아닙니다. 불편한 순간을 자기가 아는 방법으로 흐트러뜨리는 겁니다."]}, {"t": "h", "text": "웃지 말고 표정을 그대로 두세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["제가 제일 자주 하는 실수가 이겁니다. 말장난이 귀여워서 웃어버립니다.", "웃어주면 아이는 분위기가 풀렸다고 느낍니다. 사실 그게 아이가 원했던 거고요.", "그 순간 아이는 방금 한 말이 통했다고 배웁니다. 다음에 더 빨리 꺼냅니다.", "혼낼 필요는 없습니다. 표정만 바꾸지 않으면 됩니다. 목소리 크기도 그대로 둡니다."]}, {"t": "p", "lines": ["\"아빠는 지금 웃는 거 아니야.\"", "\"이거 먼저 이야기하자.\""]}, {"t": "p", "lines": ["반응이 밋밋하면 그 방법을 몇 번 안에 접기도 합니다."]}, {"t": "h", "text": "규칙은 같은 문장으로 반복하세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["말을 늘리면 말장난 재료만 늘어납니다.", "설명을 길게 할수록 아이가 붙잡을 단어가 많아집니다. 문장은 짧게, 그리고 매번 똑같이 씁니다.", "새로 설명하지 말고 처음 한 말을 그대로 다시 말하는 게 낫습니다."]}, {"t": "p", "lines": ["\"그건 안 돼.\"", "\"안 돼. 내려놓자.\"", "\"아빠 말 끝나고 놀자.\""]}, {"t": "p", "lines": ["같은 문장이 세 번쯤 반복되면 이건 안 바뀌는 거라고 받아들이기 시작합니다."]}, {"t": "h", "text": "칭찬은 그 자리를 벗어난 뒤에 하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["칭찬을 아예 접을 필요는 없습니다. 자리를 옮기면 됩니다.", "말이 늘어난 건 분명히 칭찬할 일입니다. 다만 규칙을 말하는 그 자리에서 칭찬까지 하면 아이는 뭘 들어야 할지 헷갈립니다.", "저는 그날 저녁 목욕하면서 따로 말해줬습니다."]}, {"t": "p", "lines": ["\"아까 지아가 말 재밌게 하더라.\"", "\"그 말 아빠도 처음 들어봤어.\"", "\"놀 때 그렇게 말하면 진짜 웃겨.\""]}, {"t": "p", "lines": ["칭찬을 옮겨 두면 웃겨도 되는 때와 안 되는 때를 아이도 나눠 가기 시작합니다."]}, {"t": "p", "lines": ["말장난을 한다는 건 그만큼 말이 늘었다는 뜻이잖아요. 그 자체가 나쁜 신호는 아닙니다.", "저도 아직 반쯤 웃다가 수습하는 날이 있습니다. 그런 날은 그냥 넘어갑니다.", "한 번 웃어줬다고 그동안 한 게 없어지지도 않습니다.", "저희는 규칙을 말할 때 문장을 미리 정해둡니다. 그 자리에서 새 문장을 만들면 저도 모르게 길어지더군요.", "같은 상황에서 말장난이 계속 나온다면 규칙 자체를 한 번 더 볼 필요도 있습니다. 26개월이 지키기엔 너무 긴 요구였을 수도 있어서요.", "요즘은 \"안 돼\"를 말하기 전에 숨을 한 번 쉽니다.", "웃음이 먼저 새어 나오는 걸 막으려고요. 아직 반은 실패합니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "26개월 훈육이 말장난에서 멈춰 섭니다.", "01-situation": "아이는 웃으며 아빠의 말을 슬쩍 피합니다.", "02-child": "장난기 어린 웃음이 환하게 번집니다.", "03-interaction": "웃어주는 대신 이걸 그대로 뒀습니다.", "04-recovery": "대화 뒤 부녀가 다시 편안하게 웃습니다."}, "chars": 1112, "kwn": 1}, {"no": "09", "folder": "09-read-to-both", "series": "남매둥이 아빠의 오답노트", "pillar": "P2 남매둥이라서", "title": "동시에 책 들고 오는 남매둥이, 한 명씩 읽어주기 전에 바꿔야 할 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #쌍둥이책읽어주기 #26개월아기 #쌍둥이육아 #아빠육아 #그림책육아 #육아꿀팁 #두돌아기 #잠자리독서", "kw": "쌍둥이 책 읽어주기", "q": "쌍둥이 책 읽어주기", "a": "한 명씩 따로 읽어주는 대신, 가운데 앉아 두 권을 번갈아 한 권씩 읽습니다.", "situ": "둘이 각자 책을 들고 동시에 내밉니다", "hook": ["한 명씩 읽어주기 전에", "바꿔야 할 이것"], "hidden": "이것", "cuts": [{"key": 명은 허겁지겁, 한 명은 식탁 근처에도 안 옴", "hook": ["억지로 앉히기 전에", "봐야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["저녁 6시, 지우는 자리에 앉자마자 허겁지겁 먹기 시작했습니다.", "지아는 식탁 쪽은 보지도 않고 거실에서 장난감만 만지고 있었습니다.", "몇 번 불러도 안 오길래 제가 들어다 의자에 앉혔습니다.", "지아는 그대로 발버둥을 쳤고, 식판이 뒤집혔습니다.", "그날 저녁은 거기서 끝났습니다. 둘 다 그대로 씻으러 들어갔습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["쌍둥이 키우는 집에서 밥 시간 전쟁 경험이 많은 집이라면 한번쯤 있었을 법한 일입니다.", "한 명 때문에 둘의 식사가 통째로 끝나기도 하죠.", "그렇다고 매번 밥상을 두 번 차리기도 힘들고, 함께 한번에 먹으면 좋을텐데,", "아이들의 식사 습관 잡기는 참 쉽지가 않습니다."]}, {"t": "h", "text": "먹고 있는 아이 쪽을 먼저 지키세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["사실, 요즘같이 영양이 충분한 시대에 한두끼 안 먹어도 크게 문제는 없습니다.", "더군다나 늘 균형잡힌 식사를 하고 틈틈히 간식까지 잘 챙겨먹으니 건강도 크게 걱정할 필요는 없습니다."]}, {"t": "p", "lines": ["문제는, 습관입니다.", "안 먹는 아이한테 매달리는 동안 잘 먹던 아이 식사도 같이 끝납니다.", "제가 지아랑 장난감 앞에서 씨름하는 걸 보더니 지우도 결국, 숟가락을 놓았습니다.", "본인도 놀고 싶었을테니까요."]}, {"t": "p", "lines": ["이럴 땐 안 먹는 아이와 씨름하기 보다는 먹는 아이와 식탁에 남아 있는게 낫습니다."]}, {"t": "p", "lines": ["\"지우는 여기서 아빠랑 계속 먹자.\"", "\"지아는 오고 싶을 때 와.\""]}, {"t": "p", "lines": ["한명이라도 식사를 하게 될 수도 있고, 또 그 모습을 보고 나머지 한 명이 식사에 참여하게 될 수도 있어요."]}, {"t": "h", "text": "데려오지 말고 자리만 열어두세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["저는 이제 아이를 들어 옮기지 않습니다.", "대신 의자를 빼두고, 자리가 비어 있다는 걸 말로 알려줍니다.", "26개월은 부른다고 바로 오지는 않지만, 저 자리가 자기 것이라는 건 알아듣습니다."]}, {"t": "p", "lines": ["\"지아 자리 여기 비워뒀어.\"", "\"밥 여기 있어. 올 때 먹자.\"", "\"안 먹어도 돼. 자리는 있어.\""]}, {"t": "p", "lines": ["들어 옮기지 않으면 적어도 식판이 엎어지는 일도 줄고, 불필요한 감정 소모도 없어집니다.", "아이 밥을 패스했다는 죄책감(!)이 좀 남긴 하지만, 한두번 굶다보면 본인이 먼저 옵니다.", "그러면서 자연스럽게 식사 전쟁이 줄어들게 될 거에요."]}, {"t": "h", "text": "엎어진 다음에는 혼내지 마세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["제일 곤혹스러운 순간은 밥을 안 먹을 때가 아니라 뭔가 엎어진 다음입니다.", "그날 저는 아무 말도 못 하고 식판부터 치웠고, 지아는 제 표정만 보고 있었습니다.", "엎은 걸 혼내면 아이는 다음에도 붙잡힐 때마다 몸으로 버팁니다.", "차라리 치우는 걸 같이 하는 게 낫습니다."]}, {"t": "p", "lines": ["\"쏟았네. 같이 치우자.\"", "\"휴지는 지아가 가져올래?\"", "\"다 치웠다. 이제 됐어.\""]}, {"t": "p", "lines": ["같이 치우고 나면 다음 끼니에 훨씬 덜 굳은 얼굴로 앉는 편이에요."]}, {"t": "p", "lines": ["밥을 남기는 것보다 식사 자리가 싸움으로 기억되는 게 더 오래갑니다. 한 끼 정도는 덜 먹어도 괜찮잖아요.", "저희는 이제 식판이 엎어지면 그날 저녁을 짧게 끝냅니다. 억지로 다시 앉히지 않고요.", "아내는 처음부터 지아를 부르기만 했습니다. 저는 그게 왜 더 빨랐는지 나중에야 알았습니다."]}, {"t": "p", "lines": ["쌍둥이 밥투정은 둘 다 안 먹을 때보다 한 명만 안 먹을 때가 더 어렵습니다. 그때 지킬 건 안 먹는 아이가 아니라 먹고 있는 아이입니다."]}, {"t": "p", "lines": ["---"]}], "caps": {"00-thumb-bg": "쌍둥이 밥투정이 시작된 저녁 식탁입니다.", "01-situation": "한 아이는 먹고 한 아이는 놀이를 이어갑니다.", "02-child": "아빠와 아이가 차분히 식사를 이어갑니다.", "03-interaction": "끌어오는 대신 이걸 비워뒀습니다.", "04-recovery": "쌍둥이가 다시 나란히 앉아 식사합니다."}, "chars": 1116, "kwn": 1}, {"no": "06", "folder": "06-morning-rush", "series": "남매둥이 아빠의 오답노트", "pillar": "P5 26개월 발달·생활", "title": "매일 아침 애들 등원준비, \"빨리\"보다 먼저 말해줘야 할 \"이것\"", "tags": "#남매둥이아빠 #오답노트 #애들등원준비 #26개월아기 #쌍둥이육아 #아빠육아 #등원준비꿀팁 #육아꿀팁 #어린이집등원 #두돌아기", "kw": "애들 등원준비", "q": "애들 등원준비", "a": "한 번에 하나씩, 순서를 정해서 말해주면 아이도 어디서부터 시작할지 알게 됩니다.", "situ": "손 씻고 세수까지는 곧잘 하는데", "hook": ["\"빨리\"보다 먼저", "말해줘야 할 이것"], "hidden": "이것", "cuts": [{"key": "00-thumb-bg", "label": "썸네일 배경"}, {"key": "01-situation", "label": "상황"}, {"key": "02-child", "label": "아이"}, {"key": "03-interaction", "label": "상호작용"}, {"key": "04-recovery", "label": "회복"}], "blocks": [{"t": "p", "lines": ["아침을 먹고 나면 지우랑 지아는 손 씻고 세수까지는 곧잘 합니다.", "그런데 딱 거기까지입니다."]}, {"t": "p", "lines": ["가방 메고 신발 신을 차례가 되면, 둘 다 약속이라도 한 듯 장난감 쪽으로 뜁니다.", "저는 그 뒤에서 \"얼른 가야지\"를 오늘도 세 번째 말하고 있었습니다."]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["애들 등원준비 때마다 꼭 여기서 막힙니다.", "말을 안 듣는다고 생각했는데, 26개월한테 \"빨리\"는 애초에 알아들을 수 있는 말이 아니더군요.", "시계는 자꾸 가는데 재촉하면 오히려 느려집니다. 그렇다고 매일 한 시간씩 일찍 깨울 수도 없고요."]}, {"t": "p", "lines": ["저도 처음엔 늑장 부린다고만 생각했습니다. 근데 속도가 문제가 아니었습니다. 제가 한 번에 던지는 지시가 너무 많았습니다."]}, {"t": "p", "lines": ["미국언어청각협회(ASHA)는 19~24개월 이정표로 \"숟가락을 가져와서 식탁에 놓아줘\"처럼 이어지는 두 단계 지시를 따르는 정도를 꼽습니다.", "26개월도 비슷합니다. 손 씻기, 세수, 신발, 가방까지 네 단계를 한꺼번에 들으면 처음 한두 개만 남습니다.", "\"빨리\"는 지시가 아니라  ["\"엄마.\""]}, {"t": "img", "n": 1}, {"t": "p", "lines": ["그날 밥 먹이고 기저귀 갈고 낮잠까지 재운 사람은 저였습니다.", "기저귀 개수까지 세면 제가 압도적이었고요."]}, {"t": "p", "lines": ["종일 같이 있어도 엄마만 찾는 아이를 보면, 아빠는 대개 자기 탓부터 합니다.", "이런 날 마음이 상하는 게 저만은 아니겠죠.", "이건 애착이 약해서가 아니라 순서의 문제였습니다."]}, {"t": "p", "lines": ["애착 이론을 정리한 존 볼비는 아이가 한 사람하고만 애착을 맺는 게 아니라고 봤습니다.", "여러 양육자와 애착을 맺되 그 안에 순서가 생깁니다. 이걸 애착 위계라고 부릅니다.", "중요한 건 이 순서가 함께한 시간으로만 정해지지 않고, 시기에 따라 바뀐다는 점입니다."]}, {"t": "p", "lines": ["그러니까 지우가 저를 지나친 건 제가 명단에서 빠졌다는 뜻이 아니었습니다.", "그 순간의 1번이 엄마였다는 뜻에 가까웠습니다."]}, {"t": "h", "text": "몇 번 왔는지 세지 마세요"}, {"t": "img", "n": 2}, {"t": "p", "lines": ["저는 이걸 점수처럼 셌습니다.", "지우는 넘어져서 울고 있는데, 저는 그 숫자를 세고 있었습니다."]}, {"t": "p", "lines": ["세기 시작하면 아이가 엄마한테 갈 때마다 아빠 표정이 먼저 굳습니다.", "아이는 그 표정을 읽습니다."]}, {"t": "p", "lines": ["대신 이렇게 말해보세요."]}, {"t": "p", "lines": ["\"엄마한테 가고 싶었구나.\"", "\"아빠 여기 있을게.\"", "\"다 울고 나면 아빠가 약 발라줄게.\""]}, {"t": "p", "lines": ["아이의 선택을 인정하는 말이 관계를 포기하는 말은 아닙니다.", "아빠 표정이 편해지면 아이도 아빠 쪽을 훨씬 자주 돌아보게 될 거예요."]}, {"t": "h", "text": "밀려나도 그 자리를 지키세요"}, {"t": "img", "n": 3}, {"t": "p", "lines": ["종일 같이 있어도 엄마만 찾는 아이 앞에서, 아빠가 가장 하기 쉬운 실수입니다.", "서운하면 슬쩍 방으로 들어가거나 휴대폰을 봅니다."]}, {"t": "p", "lines": ["그런데 아이는 대부분 몇 분 뒤에 돌아옵니다.", "그때 아빠가 자리에 없으면, 아이 입장에서는 그게 더 큰 신호가 됩니다."]}, {"t": "p", "lines": ["\"아빠 여기서 기다릴게.\"", "\"다 하고 나면 아빠랑 블록 하자.\"", "\"지우 안아주고 나면 아빠 차례 하자.\""]}, {"t": "p", "lines": ["밀려났을 때 사라지지 않는 것, 이것만으로도 순서는 조금씩 움직이게 될 거예요."]}, {"t": "h", "text": "아빠 담당 시간을 하루 하나 정하세요"}, {"t": "img", "n": 4}, {"t": "p", "lines": ["모든 순간에 1번이 되려고 하면 아빠가 먼저 지칩니다.", "하루 종일 붙어 있는데도 매번 밀리면 힘 빠지잖아요."]}, {"t": "p", "lines": ["하루에 한 자리만 정하세요. 저희 집은 목욕입니다.", "지아는 물장난을 치고 지우는 그냥 앉아만 있는데, 그 시간만큼은 둘 다 저를 찾습니다.", "물 때문일 가능성이 높지만 일단 1번은 1번입니다."]}, {"t": "p", "lines": ["\"목욕은 아빠랑 하는 거야.\"", "\"이건 아빠 담당이야.\""]}, {"t": "p", "lines": ["매일 반복되는 자리가 하나 생기면, 아이 안에서 아빠의 순서도 자리를 잡게 될 거예요."]}, {"t": "p", "lines": ["셋 다 하실 필요는 없습니다. 저도 첫 번째부터 자주 실패합니다."]}, {"t": "p", "lines": ["그리고 이 순서는 아프거나 겁먹었을 때 특히 엄마 쪽으로 기웁니다.", "평소에는 아빠를 찾다가 그런 날만 엄마를 찾는다 <script>
var POSTS = JSON.parse(document.getElementById("doc-data").textContent);
var toastEl = document.getElementById("toast");

function toast(m){toastEl.textContent=m;toastEl.classList.add("show");
  setTimeout(function(){toastEl.classList.remove("show")},1600)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function imgsrc(p,key){return p.folder + "/images/" + key + ".png"}

function copyRich(html, plain){
  if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    var item = new ClipboardItem({
      "text/html": new Blob([html], {type:"text/html"}),
      "text/plain": new Blob([plain], {type:"text/plain"})
    });
    navigator.clipboard.write([item]).then(
      function(){toast("복사했습니다 — 스마트에디터에 붙여넣으세요")},
      function(){copyPlain(plain)});
  } else { copyPlain(plain); }
}
function copyPlain(t){
  navigator.clipboard.writeText(t).then(
    function(){toast("복사했습니다")},
    function(){toast("복사 실패 — 브라우저 권한을 확인하세요")});
}

function bodyHtml(p){
  var out = "";
  p.blocks.forEach(function(b){
    if(b.t === "img") out += '<p>[[이미지 ' + b.n + ']]</p>';
    else if(b.t === "h") out += '<p><strong>' + esc(b.text) + '</strong></p>';
    else out += '<p>' + b.lines.map(esc).join("<br>") + '</p>';
  });
  if(p.tags) out += '<p>' + esc(p.tags) + '</p>';
  return out;
}

function bodyPlain(p){
  var out = [];
  p.blocks.forEach(function(b){
    if(b.t === "img") out.push("[[이미지 " + b.n + "]]");
    else if(b.t === "h") out.push(b.text);
    else out.push(b.lines.join("\n"));
  });
  if(p.tags) out.push(p.tags);
  return out.join("\n\n");
}
function runCmd(p){
  return p.series === "우아네 출동일지"
    ? "~/naver-parenting/run.sh d" + p.no
    : "~/naver-parenting/run.sh " + p.no;
}
function promptPack(p){
  return "이 편의 이미지 프롬프트: " + p.folder + "/image-prompts.md\n\n"
    + "터미널에서 한 줄로 생성:\n  " + runCmd(p) + "\n\n"
    + "썸네일만 다시:\n  python3 _guide/make-thumbnail.py " + p.folder + "\n\n"
    + p.cuts.length + "컷: " + p.cuts.map(function(c){return c.key + ".png"}).join(", ") + "\n\n"
    + "ALT는 만들지 않습니다. 네이버 블로그는 이미지 alt를 입력할 수 없고,\n"
    + "캡션을 넣어도 alt는 빈 값으로 발행됩니다. 캡션만 실제로 나갑니다.";
}

function render(i){
  var p = POSTS[i];
  document.querySelectorAll(".navbtn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-idx") == i);
  });

  var kwbad = (p.kwn < 4);
  var subparts = [p.no + '번'];
  if(p.pillar) subparts.push(esc(p.pillar));
  subparts.push('폴더 <code>' + p.folder + '</code>');
  subparts.push('본문 ' + p.chars + '자(공백 제외)');
  subparts.push('키워드구 ' + (kwbad
      ? '<span class="bad">' + p.kwn + '회 — 4~5회 권장</span>' : p.kwn + '회'));

  var h = "";
  h += '<div class="series-badge">' + esc(p.series) + '</div><br>';
  h += '<div class="doc-title">' + esc(p.title) + '</div>';
  h += '<div class="doc-sub">' + subparts.join(' · ') + '</div>';

  h += '<div class="hint">붙여넣기 순서 — ① <b>본문 복사</b>로 스마트에디터에 붙여넣습니다 '
     + '② <code>[[이미지 N]]</code> 자리에 해당 번호 이미지를 올리고 마커 줄은 지웁니다 '
     + '③ 이미지마다 <b>캡션</b>을 넣습니다(ALT 입력란은 없습니다) '
     + '④ 제목을 복사해 넣습니다 (태그는 본문 맨 끝에 자동으로 붙습니다) ⑤ <b>AI 생성물 표기</b>를 켭니다</div>';

  h += '<div class="thumbrow">';
  h += '<img src="' + imgsrc(p,"thumbnail") + '" alt="' + esc(p.title) + ' 썸네일" '
     + 'onerror="this.style.display=\'none\'">';
  h += '<div class="tx"><b>대표 이미지</b><br>' + esc(p.situ) + '<br>'
     + esc(p.hook.join(" / ")) + '<br>'
     + (p.hidden ? '<span style="color:var(--pen)">' + esc(p.hidden) + '</span> 에 펜 마크' : '')
     + '</div>';
  h += '</div>';

  h += '<div class="meta-grid">';
  h += '<div class="k">제목</div><div class="v">' + esc(p.title) + '</div>'
     + '<button class="mini" data-copy="' + esc(p.title) + '">복사</button>';
  h += '<div class="k">검색 질문</div><div class="v">' + esc(p.q) + '</div><div></div>';
  h += '<div class="k">이 글의 답</div><div class="v">' + esc(p.a) + '</div><div></div>';
  h += '<div class="k">키워드구</div><div class="v" style="color:var(--pen);font-weight:600">'
     + esc(p.kw) + '</div><div></div>';
  h += '</div>';

  h += '<div class="toolbar">';
  h += '<button class="btn primary" id="c-body">📋 본문 복사 (서식 유지)</button>';
  h += '<button class="btn" id="c-plain">본문 평문 복사</button>';
  h += '<button class="btn" id="c-prompt">📁 이미지 생성 명령 복사</button>';
  h += '</div>';

  h += '<h2 class="sec">캡션 ' + p.cuts.length + '줄</h2><table>';
  p.cuts.forEach(function(c,ci){
    var capText = p.caps[c.key] || "";
    h += '<tr><th>' + ci + ' ' + esc(c.label) + '</th><td>'
       + esc(capText || "—")
       + '<br><span style="color:var(--muted);font-size:12px">' + c.key + '.png</span></td>'
       + '<td class="copycol">' + (capText ? '<button class="mini" data-copy="' + esc(capText) + '">복사</button>' : '') + '</td></tr>';
  });
  h += '</table>';

  h += '<div id="preview">';
  p.blocks.forEach(function(b){
    if(b.t === "img"){
      var cut = p.cuts[b.n] || {key:"0"+b.n+"-cut", label:"컷 "+b.n};
      var key = cut.key, cap = p.caps[key] || "";
      var isHook = (b.n === 3 && p.hidden);
      h += '<figure class="cut' + (isHook ? ' hook' : '') + '">';
      h += '<img src="' + imgsrc(p,key) + '" alt="' + esc(cap) + '" loading="lazy" '
         + 'onerror="this.parentNode.innerHTML=\'<div class=&quot;missing&quot;>이미지 없음 — '
         + key + '.png</div>\'">';
      h += '<figcaption><span class="cutlab">' + b.n + ' ' + esc(cut.label) + '</span>'
         + esc(cap || "캡션 없음") + '</figcaption></figure>';
    } else if(b.t === "h"){
      h += '<p class="h">' + esc(b.text) + '</p>';
    } else {
      var q = b.lines.length && b.lines[0].charAt(0) === '"';
      h += '<p' + (q ? ' class="q"' : '') + '>' + b.lines.map(esc).join("<br>") + '</p>';
    }
  });
  if(p.tags) h += '<p class="tags-line">' + esc(p.tags) + '</p>';
  h += '</div>';

  h += '<h2 class="sec">이미지 생성</h2><pre>' + esc(promptPack(p)) + '</pre>';

  document.getElementById("main").innerHTML = h;
  document.getElementById("c-body").onclick = function(){ copyRich(bodyHtml(p), bodyPlain(p)); };
  document.getElementById("c-plain").onclick = function(){ copyPlain(bodyPlain(p)); };
  document.getElementById("c-prompt").onclick = function(){ copyPlain(promptPack(p)); };
  document.querySelectorAll("[data-copy]").forEach(function(b){
    b.onclick = function(){ copyPlain(b.getAttribute("data-copy")); };
  });
  window.scrollTo(0,0);
  document.querySelector("main").scrollTop = 0;
}

var nav = document.getElementById("nav");
var curGroup = null, curItems = null, curSeries = null;
POSTS.forEach(function(p,i){
  if(p.series !== curSeries){
    curSeries = p.series;
    var count = POSTS.filter(function(x){return x.series === curSeries}).length;
    var group = document.createElement("div");
    group.className = "navgroup" + (i === 0 ? " open" : "");
    var title = document.createElement("div");
    title.className = "navgroup-title";
    title.innerHTML = '<span>' + esc(curSeries) + '<span class="cnt">(' + count + ')</span></span>'
                     + '<span class="arrow">▶</span>';
    var items = document.createElement("div");
    items.className = "navgroup-items";
    title.onclick = function(){ group.classList.toggle("open"); };
    group.appendChild(title);
    group.appendChild(items);
    nav.appendChild(group);
    curGroup = group; curItems = items;
  }
  var b = document.createElement("button");
  b.className = "navbtn";
  b.setAttribute("data-idx", i);
  b.innerHTML = '<span class="n">' + p.no + '</span>' + esc(p.title.split(",")[0]);
  b.onclick = function(){ render(i); };
  curItems.appendChild(b);
});
render(0);
</script>
</body>
</html>
