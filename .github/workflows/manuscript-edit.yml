# 원고 뷰어 "📤 수정본 반영" 1건을 DB에 적용하고 원고 페이지를 다시 배포한다(2026-10-03 사용자 승인 설계).
#
# 발화: 뷰어 버튼 -> Pages Function(functions/api/manuscript-edit.ts, Access 토큰 검증) ->
#       repository_dispatch(manuscript_edit). client_payload = { jobId, edits: { 키: { from, to } } }.
#
# 쓰는 곳: articles.content(발행 본문) · article_jobs.metadata(images 캡션, viewerEdit 기록) ·
# manuscript_manifest_topics(이 job 한 행). LLM·이미지 생성은 부르지 않는다(비용 0).
#
# concurrency를 **걸지 않는다**: GitHub 큐는 "실행 중 1 + 대기 1"만 두고 그 이상은 대기분을 경고 없이
# 취소하는데, 이 요청은 client_payload로만 오므로 취소되면 수정이 영구 유실된다(telegram-update.yml과
# 같은 이유). 서로 다른 원고는 서로 다른 행을 쓴다. 같은 시각 두 실행의 페이지 배포가 겹치면 먼저 끝난
# 쪽 화면에 다른 쪽 수정이 빠질 수 있지만 DB는 둘 다 맞고, 다음 배포에서 맞춰진다.

name: manuscript-edit

on:
  repository_dispatch:
    types: [manuscript_edit]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run manuscripts:apply-edit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          # Serper 선지불 크레딧 게이지·소진 경보(2026-10-06). 비면 게이지·경보가 꺼진다 - cost.json을 쓰는
          # 워크플로 전부에 같은 값을 넣어야 게이지가 번갈아 사라지지 않는다.
          SERPER_CREDITS_PURCHASED: ${{ vars.SERPER_CREDITS_PURCHASED }}
          SERPER_CREDITS_PURCHASED_AT: ${{ vars.SERPER_CREDITS_PURCHASED_AT }}
          MANUSCRIPT_EDIT_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run manuscripts:apply-edit
