# 키워드 수집 감시인 - 로컬 맥과 다른 호스트(GitHub 클라우드 러너)에서 매일 돌면서
# "엔터 오전·오후·저녁 3회 + 사회 각 job이 이번 수집일에 성공했는가"를 job별로 확인한다.
# 하나라도 아니면 안 돈 job 이름을 붙여 Telegram으로 알린다(2026-10-03: 전에는 하나라도 있으면 정상으로
# 봐서 일부 job만 죽어도 경보가 없었다). 판정 로직은 src/jobs/watchdogJob.ts.
#
# 배경: docs/ai-handoff/CLOUD_MIGRATION.md, CURRENT_STATE.md "잠자기로 인한 조용한 실패".
# 로컬 09:00 job이 강제 종료되면 실패 알림조차 못 보내는데, 이 워크플로우가 그 구멍을 밖에서 막는다.
#
# 필요한 repo secret 4개 (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Playwright도 claude CLI도 쓰지 않으므로 이 4개면 충분하다.

name: keyword-collection-watchdog

# 2026-10-06 개편3: GitHub 네이티브 schedule을 걷어냈다(10/5 미발화 전력 - 다른 수집 워크플로와 같은 이유).
# 이제 Cloudflare Worker의 12 UTC(21:00 KST) 슬롯이 kscene-topic.yml과 함께 이 워크플로를 workflow_dispatch로
# 깨운다(cloudflare/telegram-relay/src/schedule.ts). 같은 시각에 도는 kscene 수집 결과는 기다리지 않고
# **전날** 수집을 확인한다(src/jobs/watchdogJob.ts WATCHED_JOBS의 dayOffset).
# 수집일은 KST 05:00에 바뀐다(collectionDayString) - 발화가 몇 시간 밀려도 같은 수집일로 본다.
on:
  workflow_dispatch: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run watchdog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Serper 선지불 크레딧 게이지·소진 경보(2026-10-06). 비면 게이지·경보가 꺼진다 - cost.json을 쓰는
          # 워크플로 전부에 같은 값을 넣어야 게이지가 번갈아 사라지지 않는다.
          SERPER_CREDITS_PURCHASED: ${{ vars.SERPER_CREDITS_PURCHASED }}
          SERPER_CREDITS_PURCHASED_AT: ${{ vars.SERPER_CREDITS_PURCHASED_AT }}
        run: npm run job:watchdog
