# 키워드 수집 감시인 - 로컬 맥과 다른 호스트(GitHub 클라우드 러너)에서 매일 돌면서
# "오늘 성공한 discovery_run이 있는가"만 확인한다. 없으면 Telegram으로 알린다.
#
# 배경: docs/ai-handoff/CLOUD_MIGRATION.md, CURRENT_STATE.md "잠자기로 인한 조용한 실패".
# 로컬 09:00 job이 강제 종료되면 실패 알림조차 못 보내는데, 이 워크플로우가 그 구멍을 밖에서 막는다.
#
# 필요한 repo secret 4개 (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Playwright도 claude CLI도 쓰지 않으므로 이 4개면 충분하다.

name: keyword-collection-watchdog

on:
  schedule:
    # 12:00 UTC = 21:00 KST. **마지막 수집 job보다 뒤여야 한다** - 이 감시인은 "오늘(Seoul) 완료된
    # run이 있는가"만 보므로, 수집보다 앞서 돌면 매일 거짓 경보가 나간다.
    # 2026-10-01: 수집이 저녁(18/19/20시 KST)으로 옮겨가면서 11:00 KST -> 21:00 KST로 미뤘다.
    # 마지막 job(커뮤니티 20:00, 약 3~5분)이 끝나고 55분 여유가 있다.
    # 수집 시각을 바꿀 때는 이 값도 같이 봐야 한다(cloudflare/telegram-relay/wrangler.toml).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run watchdog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run job:watchdog
