# 색인 건강 점검 주 1회(2026-09-21, 2단계).
#
# 왜 만들었나: "블로그가 색인이 안 된다"를 사용자가 GSC를 직접 열어보고 발견했다(2026-09-21).
# 그때 홈페이지는 구글에 알려지지도 않았고, 크롤링된 글은 전부 리디렉션 오류였다. 이 점검이
# 주 1회 돌면 사람이 찾아 들어가지 않아도 먼저 안다.
#
# 조용한 주에는 알림이 짧다(집계 한 줄). 고장이 있을 때만 목록이 붙는다 -
# classifyIndexHealth.ts가 "발견됨/대기"를 고장으로 치지 않기 때문에 거짓 경보가 나지 않는다.
#
# 발화는 Cloudflare Worker 크론(일요일 10:00 KST - 표현식은 `0 1 * * 1`이지만 실제로는 일요일에
# 깨어난다. 2026-11-02 실측, cloudflare/telegram-relay/src/schedule.ts 주석 참고).
# 2026-11-08: 리포트는 속성(=채널)마다 그 채널의 봇으로 간다(sendByTrack.ts). 그래서 사회·사용설명서 봇 자격증명도 넘긴다.
# 상태를 저장하지 않아 언제 돌려도 안전하다.
#
# 2026-11-02: 15분 타임아웃에 걸려 점검이 중간에 끊기고 뒤따르는 주간 리포트가 통째로 건너뛰어진
# 적이 있다(11/01). 원인은 URL Inspection 호출당 약 6.5초인 구글 응답 지연이고, 채널이 늘면서
# 검사 건수도 같이 늘었다. 호출을 6개씩 병렬로 돌려 시간을 줄였고(checkIndexHealthCli.ts)
# 글이 더 쌓여도 버티도록 여유를 30분으로 뒀다.

name: analytics-index-health

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: analytics-index-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run analytics:index-health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_SITE_URLS: ${{ vars.GSC_SITE_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
        run: npm run analytics:index-health -- --notify

      # 주간 검색 성과 리포트(2026-10-08). 새 Worker cron을 쓰지 않고 주간 색인 점검 경로에 동승한다.
      - name: Run analytics:weekly-report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_SITE_URLS: ${{ vars.GSC_SITE_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
        run: npm run analytics:weekly-report -- --notify
