# 사용설명서 트랙(Korea Plain) 한→영 번역 단계(개편3 §4.3-2). 한글 원고가 승인(✅)되면 TelegramBot이 이 워크플로를
# workflow_dispatch로 발화하고(runTelegramUpdateCli.ts triggerTranslation), 영어본 재승인에서 "수정 필요" 답장이 오면
# 같은 워크플로를 feedback과 함께 다시 띄운다.
#
# heavy-pipeline(조사·집필·수정) 큐를 타지 않는다: 도구 없이 텍스트만 변환하는 가벼운 호출이라 그 큐에 넣으면 20~45분짜리 집필
# 뒤에 줄을 서고 반대로 집필을 막는다. 대신 job별 concurrency 그룹으로 **같은 job의 중복 실행만** 직렬화한다
# (그룹이 job_id를 포함하므로 서로 다른 job끼리 대기 1개 한도에 걸려 취소되는 일이 없다).
#
# 필요한 repo secret: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, KSCENE_TELEGRAM_BOT_TOKEN, KSCENE_TELEGRAM_CHAT_ID,
# CLAUDE_CODE_OAUTH_TOKEN. 번역 지침은 prompts/translation/koreaplain-ko-en.md(기획 세션 ⑤가 교체).
name: job-translate

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      feedback:
        description: "영어본 재승인 단계에서 사용자가 답장으로 보낸 수정 방향(없으면 비운다)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write # 영어본 자동 승인 뒤 job-publish-prepare를 발화한다(PIPELINE_SKIP_DRAFT_REVIEW 켜짐일 때)

concurrency:
  group: job-translate-${{ inputs.job_id }}
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 다른 원고 단계와 같은 값.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job:translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2026-10-12: 미설정·빈 값이면 켜짐 - 영어본 단독 재승인을 건너뛰고 자동 승인 + 원고 준비를 발화한다.
          # repo variable PIPELINE_SKIP_DRAFT_REVIEW=false면 옛 영어 재승인 흐름(job-write·job-revise와 같은 게이트).
          PIPELINE_SKIP_DRAFT_REVIEW: ${{ vars.PIPELINE_SKIP_DRAFT_REVIEW }}
          GITHUB_TOKEN: ${{ github.token }}
          # 사용자가 텔레그램에 입력한 원문이 들어올 수 있어 셸 명령에 직접 끼우지 않고 환경변수로 넘긴다.
          JOB_ID: ${{ inputs.job_id }}
          FEEDBACK: ${{ inputs.feedback }}
        run: npm run job:translate -- "$JOB_ID" "$FEEDBACK"

      # 번역이 멈추면 한글 ✅ 뒤가 끊긴다 - 영어본도, Blogger 발행 버튼도 오지 않는다.
      #
      # 2026-11-12: **이 워크플로가 실패하면 아무도 모른다.** 품질 게이트가 사람인 파이프라인에서
      # 알림이 오지 않는 실패는 파이프라인이 멈춘 것과 같다 - 2026-11-11 한효주 인물 백과 사고가
      # 그랬다(job-publish-prepare.yml #77이 그 자리를 먼저 막았다).
      #
      # 왜 스텝 레벨 `if: failure()`인가: 그 사고의 run은 `npm run` 단계에 닿지도 못하고 apt에서
      # 죽었다 - CLI 안의 try/catch로는 잡을 수 없는 자리다.
      # 왜 node + .mjs인가: 알림이 npm ci·node_modules에 기대면, npm ci가 흔들린 run에서는 알림도
      # 같이 죽는다. 이 스크립트는 node 하나로 돈다(의존성 0).
      - name: 실패 알림 (트랙 봇)
        if: failure()
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 봇으로 보낼지는 이 job의 track이 정한다. 못 읽으면 메인봇(엔터)으로 가고
          # 본문에 "job 식별 실패"와 jobId가 적힌다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          # 입력값으로 이미 어느 원고인지 안다 - 대기열을 추측하지 않고 이 job만 집는다.
          FAILED_JOB_ID: ${{ inputs.job_id }}
          FAILED_WORKFLOW_FILE: job-translate.yml
        run: node scripts/notifyWorkflowFailure.mjs
