# 티스토리에 실제로 올라간 글을 DB에 적립, 하루 1회(2026-11-05 사용자 지시).
#
# 왜 만들었나: 발행이 **임시저장 + 사람이 직접 발행**으로 바뀌면서(TISTORY_PUBLISH_MODE=draft) 폴러가
# `publications` 행을 남기지 않는다. 기록이 없으면 내부 링크 후보·색인 점검·조회수 측정·발행량 판단이
# 전부 같이 멈춘다. 같은 날 폐지한 "하루 1건 상한"의 자리를 이 기록이 대신한다
# (src/workflows/publish/tistoryPublishedInventory.ts 머리말).
#
# 가볍다 - 로그인 없이 블로그 RSS 한 번(실측 50건, 0.9MB)을 읽고 제목으로 원고를 맞춘다. 캡차를 타지 않는다.
# 멱등하다 - 같은 날 몇 번 돌려도 두 번째부터는 "이미 적립"으로 지나간다.
#
# 발화는 Cloudflare Worker 크론(09:30 KST). 새 cron 슬롯을 쓰지 않고 일일 analytics-search 슬롯에
# 동승한다(schedule.ts의 `30 0 * * *`) - 무료 플랜 cron 5개 중 마지막 1칸은 예약이다.
# 09:30이면 전날 올린 글과 그날 새벽 글까지 다 들어온다.
#
# `--apply`는 원격 DB 쓰기지만 **더하기만 한다**: 없는 publication 행을 넣고, 빈/다른 주소를 맞춘다.
# 발행하지도 지우지도 않는다. 되돌리기 = 그 행을 지우는 것.

name: tistory-inventory

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB에 쓰지 않고 목록만 본다"
        required: false
        type: boolean
        default: false
      limit:
        description: "제목을 맞춰 볼 최근 article 수(비우면 600)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tistory-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tistory:inventory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 블로그를 읽을지. 비워 두면 코드 기본값(wooahpapa)을 쓴다 - 블로그를 옮기면 이 변수로 덮는다.
          TISTORY_BLOG_URL: ${{ vars.TISTORY_BLOG_URL }}
          # 티스토리 이야기라 사회 트랙 봇으로 보낸다(notifications/telegramTracks.ts).
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
        run: npm run tistory:inventory -- --notify ${{ inputs.dry_run && ' ' || '--apply' }} ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
