# 엔터·OTT 키워드 수집. 2026-10-05부터 social-issue와 무관하게 자체 수집한다(entertainmentKeywordJob.ts
# 상단 주석, RESTRUCTURE-PLAN-2026-10.md §2.2). 하루 3회(KST 09/13/18시) - 회차는 round 입력으로 받는다.
#
# 지금은 workflow_dispatch(수동)만 - social-issue-keyword.yml과 같은 이유로 schedule은 아직 안 넣음.
#
# 필요한 repo secret: social-issue-keyword.yml과 동일(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, CLAUDE_CODE_OAUTH_TOKEN
# - rank 단계 주제어 추출도 runHeadlessClaude를 쓴다, social-issue-keyword.yml 2026-09-13 메모 참고).

name: entertainment-keyword

# 2026-09-16: schedule: 제거, Cloudflare Worker Cron Trigger가 대신 깨운다(social-issue-keyword.yml
# 상단 메모와 같은 이유). social-issue-keyword.yml(KST 18:00)보다 1시간 뒤인 KST 19:00에 돌도록
# Worker 쪽에 등록돼 있다 - social-issue가 채운 trend_candidates를 읽는 순서 의존이 유지된다.
on:
  workflow_dispatch:
    inputs:
      round:
        description: "회차(morning|noon|evening). 비우면 실행 시각(KST)으로 추정"
        required: false
        default: ""

concurrency:
  group: entertainment-keyword
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (주제어 추출 LLM 호출용)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run entertainment-keyword
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 경쟁도(블로그 포화도)를 점수에 반영할지. Phase B 게이트(config/keywordCompetition.ts).
          # repo variable로 빼둬서 코드 변경 없이 되돌릴 수 있다 - 6-factor scoring이 바뀌는 값이다.
          BLOG_COMPETITION_APPLY_TO_SCORE: ${{ vars.BLOG_COMPETITION_APPLY_TO_SCORE }}
          # 주제어 기반 다양성 판정. 미설정이면 빈 문자열 -> false(preview만). 켤 때 repo variable로 true.
          DIVERSITY_TOPIC_QUERY_ENABLED: ${{ vars.DIVERSITY_TOPIC_QUERY_ENABLED }}
          # 알림 제목·run metadata의 회차. 비어 있으면 job이 실행 시각으로 추정한다.
          KEYWORD_ROUND: ${{ inputs.round }}
        run: npm run job:entertainment-keyword
