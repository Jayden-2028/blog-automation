# 사용설명서 트랙(The Korea Manual) 주제 제안. KST 21:00에 Worker cron(UTC 12시 슬롯, watchdog과 동시)이 깨운다(개편3 §4.2).
# 구글 영문 자동완성으로 에버그린 주제를 뽑아 사용설명서 봇(@KoreanManualBot)에 Go/Pass로 보낸다.
# 트리거는 workflow_dispatch뿐이다 - schedule은 쓰지 않는다(다른 수집 워크플로와 같은 이유, social-issue-keyword.yml 메모).
#
# 필요한 repo secret: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (실패 알림은 메인봇), KSCENE_TELEGRAM_BOT_TOKEN, KSCENE_TELEGRAM_CHAT_ID, CLAUDE_CODE_OAUTH_TOKEN(20자 요약 생성).
# NAVER 키는 쓰지 않는다 - 한국 소스가 없다.

name: kscene-topic

on:
  workflow_dispatch: {}

concurrency:
  group: kscene-topic
  cancel-in-progress: false

env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (항목별 한 줄 요약 생성용)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run kscene-topic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run job:kscene-topic
