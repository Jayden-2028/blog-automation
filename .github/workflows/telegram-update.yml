# 클라우드 이전 Phase 3 - 텔레그램 버튼 클릭 1건을 처리하는 워크플로우. 로컬 telegram-poll처럼
# getUpdates로 배치를 긁어오는 대신, Cloudflare Worker(텔레그램 webhook 릴레이)가 이 워크플로우를
# repository_dispatch API로 직접 발화하며 update 원본 JSON을 client_payload로 넘긴다.
#
# permissions.actions: write가 필요하다 - triggerResearch/triggerWriting이 job-research.yml/
# job-write.yml을 workflow_dispatch API로 새로 발화하기 때문(dispatchWorkflow.ts 참고).
#
# 제목 생성(Go 클릭 시, ~25초)은 이 워크플로우 안에서 동기로 돈다(로컬과 동일) - 그래서
# claude CLI가 여기도 필요하다. 리서치/집필 자체(수 분~20분)는 여기서 안 기다리고 다른 워크플로우로
# 넘긴다.
#
# 2026-09-16: concurrency group(`telegram-update`)을 **없앴다**. GitHub concurrency 큐는 "실행 중
# 1개 + 대기 1개"까지만 허용하고 그 이상이 들어오면 대기 중이던 실행을 경고 없이 취소하는데, 이
# 워크플로우는 update 원본을 client_payload로만 받으므로 취소된 실행의 클릭은 **영구 유실**된다
# (Worker는 이미 텔레그램에 200을 돌려줘 재전송도 없다). 실측: 한 실행이 ~40초(러너 부팅 + npm ci +
# claude CLI 설치)라 사용자가 버튼을 40초 안에 3번만 눌러도 세 번째가 두 번째를 밀어냈다 - 09-16
# 하루에만 취소 14건(커뮤니티 키워드 Go 2건, 원고 승인 1건, 수정 답장 1건 등이 이 경로로 사라짐).
# 클릭 1건 = 실행 1건이고 각 실행은 서로 다른 update를 다루므로 직렬화할 이유가 없다 - 병렬로
# 돌려도 안전하다: 같은 키워드 Go 중복은 article_jobs의 unique index(uq_article_jobs_run_rank)가,
# 검수 버튼 중복은 TelegramBot.ts의 idempotency 가드가, heavy-pipeline 발화 순서는
# pipelineQueue.ts의 DB 락(원자적 CAS)이 각각 막는다.

name: telegram-update

on:
  repository_dispatch:
    types: [telegram_update]

permissions:
  contents: read
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (제목 생성용)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job:telegram-update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload) }}
          # 원고 준비 완료 알림의 "🚀 블로그 발행" 버튼이 여기서 바로 Blogger를 호출한다(2026-09-19).
          # 배리에이션 원고가 이미 있어 LLM 호출이 없고 수 초면 끝나므로 별도 워크플로우로 넘기지 않는다.
          BLOGGER_ENABLED: ${{ vars.BLOGGER_ENABLED }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 버튼 경로는 호출 인자로 공개(asDraft:false)를 명시하므로 이 값에 영향받지 않는다.
          BLOGGER_PUBLISH_AS_DRAFT: ${{ vars.BLOGGER_PUBLISH_AS_DRAFT }}
          # 미설정이면 코드 기본값(20)을 쓴다. 조절은 vars에서 - 코드 수정·배포가 필요 없다.
          BLOGGER_DAILY_LIMIT: ${{ vars.BLOGGER_DAILY_LIMIT }}
        run: npm run job:telegram-update
