# 클라우드 이전 Phase 3 - 텔레그램 버튼 클릭 1건을 처리하는 워크플로우. 로컬 telegram-poll처럼
# getUpdates로 배치를 긁어오는 대신, Cloudflare Worker(텔레그램 webhook 릴레이)가 이 워크플로우를
# repository_dispatch API로 직접 발화하며 update 원본 JSON을 client_payload로 넘긴다.
#
# permissions.actions: write가 필요하다 - triggerResearch/triggerWriting이 job-research.yml/
# job-write.yml을 workflow_dispatch API로 새로 발화하기 때문(dispatchWorkflow.ts 참고).
#
# 제목 생성(Go 클릭 시, ~25초)은 이 워크플로우 안에서 동기로 돈다(로컬과 동일) - 그래서
# claude CLI가 여기도 필요하다. 리서치/집필 자체(수 분~20분)는 여기서 안 기다리고 다른 워크플로우로
# 넘긴다.
#
# 2026-09-16: concurrency group(`telegram-update`)을 **없앴다**. GitHub concurrency 큐는 "실행 중
# 1개 + 대기 1개"까지만 허용하고 그 이상이 들어오면 대기 중이던 실행을 경고 없이 취소하는데, 이
# 워크플로우는 update 원본을 client_payload로만 받으므로 취소된 실행의 클릭은 **영구 유실**된다
# (Worker는 이미 텔레그램에 200을 돌려줘 재전송도 없다). 실측: 한 실행이 ~40초(러너 부팅 + npm ci +
# claude CLI 설치)라 사용자가 버튼을 40초 안에 3번만 눌러도 세 번째가 두 번째를 밀어냈다 - 09-16
# 하루에만 취소 14건(커뮤니티 키워드 Go 2건, 원고 승인 1건, 수정 답장 1건 등이 이 경로로 사라짐).
# 클릭 1건 = 실행 1건이고 각 실행은 서로 다른 update를 다루므로 직렬화할 이유가 없다 - 병렬로
# 돌려도 안전하다: 같은 키워드 Go 중복은 article_jobs의 unique index(uq_article_jobs_run_rank)가,
# 검수 버튼 중복은 TelegramBot.ts의 idempotency 가드가, heavy-pipeline 발화 순서는
# pipelineQueue.ts의 DB 락(원자적 CAS)이 각각 막는다.

name: telegram-update

on:
  repository_dispatch:
    types: [telegram_update]

permissions:
  contents: read
  actions: write

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  process:
    runs-on: ubuntu-latest
    # 2026-10-06 개편3: 5분 -> 15분. 사용설명서 "🔵 Blogger 발행" 버튼이 여기서 발행 이미지를 공개 Pages로 복사한다
    # (원본 내려받기 + wrangler pages deploy + 서비스 확인 최대 60초 - rehostImagesToPages.ts). 평소 클릭은 여전히 ~40초면 끝난다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (제목 생성용)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job:telegram-update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 트랙별 텔레그램 봇(멀티봇, notifications/telegramTracks.ts). job.metadata.track에 맞는 봇으로 알림이 나간다.
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          # 인스타 변환기 봇(2026-10-06 웹훅 전환) - 링크 수신·트랙 버튼 처리가 여기서 돈다.
          INSTAGRAM_BOT_TOKEN: ${{ secrets.INSTAGRAM_BOT_TOKEN }}
          INSTAGRAM_BOT_CHAT_ID: ${{ secrets.INSTAGRAM_BOT_CHAT_ID }}
          # 종합 키워드 입력 툴(B부) 링크 자동 추출: 네이버 뉴스 링크 -> 검색 API로 언론사 원문 링크를 찾는다 / 유튜브는 Data API 메타만.
          # YOUTUBE_API_KEY가 없으면 유튜브 기능만 꺼진다(비치명) - 발급은 사용자 작업(구글 클라우드 콘솔 -> YouTube Data API v3).
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload) }}
          # 원고 준비 완료 알림의 "🚀 블로그 발행" 버튼이 여기서 바로 Blogger를 호출한다(2026-09-19).
          # 배리에이션 원고가 이미 있어 LLM 호출이 없고 수 초면 끝나므로 별도 워크플로우로 넘기지 않는다.
          # 자료조사 제공자 스위치(2026-11-01). Go 버튼이 조사를 어디로 보낼지 이 값이 정한다 -
          # claude/gemini면 job-research.yml(클라우드), codex면 맥미니 폴러 대기열
          # (job.metadata.localResearch)이다. **job-research.yml에는 이 변수를 넘기지 않는다** -
          # Actions는 Claude만 돌릴 수 있으므로(Codex CLI·구독 로그인이 맥에만 있다) 거기서는 항상
          # 기본값 claude여야 한다. 비어 있으면(미설정) claude - 기존 동작 그대로다.
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER }}
          BLOGGER_ENABLED: ${{ vars.BLOGGER_ENABLED }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 사용설명서 글 공개 시 Bing URL 제출(2026-10-27). 시크릿이 없으면 빈 값이라 기능이 조용히 꺼진다. 사이트 주소는 BING_SITE_URL(선택).
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: ${{ vars.BING_SITE_URL }}
          # 사용설명서 트랙(Korea Plain, 개편3): 같은 구글 계정이라 refresh token은 그대로, blogId만 다르다. 비밀이 아니라
          # secret/variable 어느 쪽에 둬도 읽힌다. **비어 있으면 사용설명서 글은 발행하지 않는다**(whynowissue로 폴백 금지).
          KSCENE_BLOGGER_BLOG_ID: ${{ secrets.KSCENE_BLOGGER_BLOG_ID || vars.KSCENE_BLOGGER_BLOG_ID }}
          # 사용설명서 발행 이미지 호스팅(전용 공개 Cloudflare Pages 프로젝트). 비어 있으면 Supabase URL로 발행한다.
          KSCENE_IMAGES_PAGES_PROJECT: ${{ vars.KSCENE_IMAGES_PAGES_PROJECT }}
          KSCENE_IMAGES_BASE_URL: ${{ vars.KSCENE_IMAGES_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 버튼 경로는 호출 인자로 공개(asDraft:false)를 명시하므로 이 값에 영향받지 않는다.
          BLOGGER_PUBLISH_AS_DRAFT: ${{ vars.BLOGGER_PUBLISH_AS_DRAFT }}
          # 미설정이면 코드 기본값(20)을 쓴다. 조절은 vars에서 - 코드 수정·배포가 필요 없다.
          BLOGGER_DAILY_LIMIT: ${{ vars.BLOGGER_DAILY_LIMIT }}
        run: npm run job:telegram-update
