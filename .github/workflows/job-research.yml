# 클라우드 이전 Phase 3 - 자료조사 단계(runResearchStage)를 GitHub Actions에서 실행한다.
# 로컬에서는 TelegramBot.triggerResearch가 `npm run job:research -- <jobId>`를 detached 자식
# 프로세스로 띄웠는데, GH Actions 러너에선 detached 프로세스가 job 종료와 함께 죽으므로 이렇게
# "별도 워크플로우를 workflow_dispatch로 새로 발화"하는 방식으로 대체한다(telegram-update.yml이
# 이 워크플로우를 GitHub API로 호출 - triggerResearch override 참고).
#
# 실패 알림은 이 CLI(runResearchStageCli.ts)가 기존 코드 그대로 직접 텔레그램에 보낸다.
#
# 2026-09-15: 조사가 끝나면(성공 시) "원고를 쓸까요?" 확인 없이 이 CLI가 곧바로 job-write.yml을
# workflow_dispatch로 발화한다(runResearchStageCli.ts의 triggerWriting 참고) - telegram-update.yml
# 과 같은 이유로 permissions.actions: write + GITHUB_TOKEN이 필요하다.
#
# claude -p 사용(WebSearch/WebFetch, RESEARCH_PROVIDER=claude 기본) - CLAUDE_CODE_OAUTH_TOKEN 필요.
# 최대 소요 18분(RESEARCH_TIMEOUT_MS) - 타임아웃 여유를 넉넉히 둔다.

name: job-research

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

# job별이 아니라 전역 1개 그룹이다(2026-09-15 발견) - 텔레그램에서 Go를 연달아 누르면
# job-research 실행이 여러 개 동시에 GH Actions 러너에서 도는데, 같은 Claude 구독 계정의
# claude -p 자원을 나눠 쓰면서 개별 조사가 평소보다 오래 걸려 18분 타임아웃(RESEARCH_TIMEOUT_MS)에
# 걸렸다(96a224e9... job, 4건 동시 실행 중 1건만 18분22초 걸려 실패, 나머지 3건은 6~8분).
# job-write.yml/job-revise.yml과 같은 그룹 이름(heavy-pipeline)을 써서 셋이 서로도 겹치지
# 않게 한다 - 예전 로컬 heavyPipelineLock.ts(단일 파일 락, 클라우드 이전 후 무력화됨)가 하려던
# 것을 GitHub Actions 자체의 큐로 대체한다. 대기 시간은 job의 timeout-minutes에 포함되지 않는다
# (큐에서 대기하는 동안은 타이머가 안 돎).
concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job:research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:research -- "${{ inputs.job_id }}"
