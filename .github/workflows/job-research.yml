# 클라우드 이전 Phase 3 - 자료조사 단계(runResearchStage)를 GitHub Actions에서 실행한다.
# 로컬에서는 TelegramBot.triggerResearch가 `npm run job:research -- <jobId>`를 detached 자식
# 프로세스로 띄웠는데, GH Actions 러너에선 detached 프로세스가 job 종료와 함께 죽으므로 이렇게
# "별도 워크플로우를 workflow_dispatch로 새로 발화"하는 방식으로 대체한다(telegram-update.yml이
# 이 워크플로우를 GitHub API로 호출 - triggerResearch override 참고).
#
# 실패 알림은 이 CLI(runResearchStageCli.ts)가 기존 코드 그대로 직접 텔레그램에 보낸다.
#
# 2026-09-15: 조사가 끝나면(성공 시) "원고를 쓸까요?" 확인 없이 이 CLI가 곧바로 job-write.yml을
# 큐에 올린다(runResearchStageCli.ts의 triggerWriting 참고) - telegram-update.yml과 같은 이유로
# permissions.actions: write + GITHUB_TOKEN이 필요하다.
#
# claude -p 사용(WebSearch/WebFetch, RESEARCH_PROVIDER=claude 기본) - CLAUDE_CODE_OAUTH_TOKEN 필요.
# 최대 소요 18분(RESEARCH_TIMEOUT_MS) - 타임아웃 여유를 넉넉히 둔다.
#
# 2026-09-16: 실행 순서는 GitHub concurrency 큐가 아니라 pipeline_dispatch_queue(Supabase, DB
# 큐)가 관리한다 - GH concurrency 큐는 "실행 중 1개 + 대기 1개"까지만 허용해서, Go를 연달아 누르면
# 대기가 넘쳐 조용히 취소되는 사고가 이틀 연속 있었다(대기 후 디스패치하는 이전 완화책도 대기
# 상한이 실제 소요 시간보다 짧아 뚫렸다). 이제 이 워크플로우는 항상 DB 큐를 통해서만 발화되고
# (직접 workflow_dispatch로 부르지 않음 - queue_id로 어느 큐 행인지 안다), 마지막 스텝이 그 큐
# 행을 마감하고 다음 대기 항목을 스스로 깨운다(체인) - src/services/github/pipelineQueue.ts 참고.
# 아래 concurrency group은 그 DB 큐 로직의 버그에 대비한 2차 안전망으로 그대로 둔다(정상 동작
# 중엔 절대 "대기 1개"를 넘지 않으므로 취소를 유발할 일이 없다).
name: job-research

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      queue_id:
        description: "pipeline_dispatch_queue.id (DB 큐를 거치지 않은 수동 실행이면 비워둔다)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  research:
    runs-on: ubuntu-latest
    # 25 -> 40 (2026-09-23). 자료조사가 무거워졌다 - researcher.md §2-1(실물을 직접 연다)·
    # §2-2(이름을 공식 채널에서 재확인)·작품 유형의 반응 탐색이 추가돼 실측 근거가 13건에서
    # 25건으로 늘었다. 여기서 잘리면 job이 `researching`에 멈춰 사람이 손대기 전까지 안 움직인다
    # (job-write가 같은 이유로 25 -> 45였다, 2026-09-22).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job:research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 트랙별 텔레그램 봇(멀티봇, notifications/telegramTracks.ts). job.metadata.track에 맞는 봇으로 알림이 나간다.
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:research -- "${{ inputs.job_id }}"

      # 조사가 멈추면 집필도 발화되지 않아, Go를 누른 키워드가 그 자리에서 조용히 사라진다.
      # (CLI 자체의 실패 알림은 CLI가 살아서 끝까지 돈 경우에만 나간다 - 러너가 그 전에 죽으면 없다.)
      #
      # 2026-11-12: **이 워크플로가 실패하면 아무도 모른다.** 품질 게이트가 사람인 파이프라인에서
      # 알림이 오지 않는 실패는 파이프라인이 멈춘 것과 같다 - 2026-11-11 한효주 인물 백과 사고가
      # 그랬다(job-publish-prepare.yml이 #77에서 그 자리를 먼저 막았다).
      #
      # 왜 스텝 레벨 `if: failure()`인가: 그 사고의 run은 `npm run` 단계에 닿지도 못하고 apt에서
      # 죽었다 - CLI 안의 try/catch로는 잡을 수 없는 자리다.
      # 왜 node + .mjs인가: 알림이 npm ci·node_modules에 기대면, npm ci가 흔들린 run에서는 알림도
      # 같이 죽는다. 이 스크립트는 node 하나로 돈다(의존성 0).
      #
      # 큐 마감(Drain)보다 **앞**에 둔다: 마감이 실패한 것까지 "집필 실패"로 알리면 이미 원고를
      # 받은 사용자에게 거짓 경보가 간다. 마감은 always()라 이 스텝 뒤에도 그대로 돈다.
      - name: 실패 알림 (트랙 봇)
        if: failure()
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 봇으로 보낼지는 이 job의 track이 정한다. 못 읽으면 메인봇(엔터)으로 가고
          # 본문에 "job 식별 실패"와 jobId가 적힌다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          # 입력값으로 이미 어느 원고인지 안다 - 대기열을 추측하지 않고 이 job만 집는다.
          FAILED_JOB_ID: ${{ inputs.job_id }}
          FAILED_WORKFLOW_FILE: job-research.yml
        run: node scripts/notifyWorkflowFailure.mjs

      # 2026-09-16: 성공/실패/타임아웃 무관하게 항상 돈다(if: always()) - 이 실행이 DB 큐 행을
      # 대신하고 있었다면 마감하고 락을 풀어 다음 대기 항목을 스스로 깨운다. queue_id가 없으면
      # (수동 gh workflow run 복구 실행 등) CLI가 조용히 아무것도 안 하고 끝난다.
      - name: Drain pipeline queue
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:pipeline-drain -- "${{ inputs.queue_id }}" "${{ job.status }}"
