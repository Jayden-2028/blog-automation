# 2026-09-15 - "수정 필요" 답장 피드백을 반영해 기준 원고를 다시 쓰는 단계
# (reviseArticleWithFeedback)를 GitHub Actions에서 실행한다. job-write.yml과 같은 이유
# (detached 프로세스가 GH Actions 러너에서 못 삶) - TelegramBot.triggerRevision override가
# 이 워크플로우를 workflow_dispatch로 발화한다(runTelegramUpdateCli.ts).
#
# claude -p + Skill(moai-marketer:content-blog, moai-writer:korean-humanize) 사용 -
# CLAUDE_CODE_OAUTH_TOKEN + 플러그인 설치 필요(job-write.yml과 동일).
#
# feedback은 workflow_dispatch string input으로 그대로 넘긴다(사용자가 텔레그램에 입력한 원문).
#
# 2026-11-06: 피드백이 원고·조사 기록에 없는 자료를 요구하면 이 run 안에서 **그 항목만** 보충 조사한다
# (reviseWithSupplementalResearch.ts - 판정 1콜 + WebSearch 1콜). 새 secret·변수는 없고, 시간은 아래
# timeout-minutes(45) 안에 든다: 판정 3분 + 보충 조사 8분 + 재작성 20분. 그래서 상한을 올리지 않았다.

# 2026-09-16: 실행 순서는 GitHub concurrency 큐가 아니라 pipeline_dispatch_queue(Supabase, DB
# 큐)가 관리한다 - 근거는 job-research.yml 상단 주석 참고(같은 사고, 같은 수정).
name: job-revise

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      feedback:
        description: "사용자가 답장으로 보낸 수정 방향"
        required: true
        type: string
      queue_id:
        description: "pipeline_dispatch_queue.id (DB 큐를 거치지 않은 수동 실행이면 비워둔다)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

# job-research.yml과 같은 전역 그룹(heavy-pipeline). DB 큐가 정상 동작하는 한 절대 "대기 1개"를
# 넘지 않으므로 취소를 유발하지 않는 2차 안전망으로만 남겨둔다.
concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  revise:
    runs-on: ubuntu-latest
    # 2026-09-22: job-write와 같은 이유로 45분(수정 재작성도 같은 LLM 경로다).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI + moai-marketer 플러그인
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      - name: Run job:revise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 트랙별 텔레그램 봇(멀티봇, notifications/telegramTracks.ts). job.metadata.track에 맞는 봇으로 알림이 나간다.
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 이미 승인·준비된 원고를 고친 경우, 재작성 뒤 job-publish-prepare.yml을 직접 발화해
          # 최종본을 다시 만든다(2026-09-19). 그 workflow_dispatch 호출에 토큰이 필요하다.
          GITHUB_TOKEN: ${{ github.token }}
          # 단계 통합(PIPELINE-MERGE-2026-10.md §2). 미설정·빈 값이면 켜짐 - 자동 승인된 원고의 수정은 이미지 마커 diff로
          # 이미지를 유지·부분 갱신한다. false면 옛 흐름(초안 재검수 / 승인 후 수정은 이미지 초기화 후 재준비).
          PIPELINE_SKIP_DRAFT_REVIEW: ${{ vars.PIPELINE_SKIP_DRAFT_REVIEW }}
        run: npm run job:revise -- "${{ inputs.job_id }}" "${{ inputs.feedback }}"

      # 1순위 자리다: 사용자가 ✏️ 수정 요청에 답장을 보내 놓고 가장 오래 기다리는 단계이고,
      # 마지막으로 받은 메시지가 "완료되면 발행 버튼과 함께 다시 보내드립니다"라 실패를 알 길이 없다.
      #
      # 2026-11-12: **이 워크플로가 실패하면 아무도 모른다.** 품질 게이트가 사람인 파이프라인에서
      # 알림이 오지 않는 실패는 파이프라인이 멈춘 것과 같다 - 2026-11-11 한효주 인물 백과 사고가
      # 그랬다(job-publish-prepare.yml이 #77에서 그 자리를 먼저 막았다).
      #
      # 왜 스텝 레벨 `if: failure()`인가: 그 사고의 run은 `npm run` 단계에 닿지도 못하고 apt에서
      # 죽었다 - CLI 안의 try/catch로는 잡을 수 없는 자리다.
      # 왜 node + .mjs인가: 알림이 npm ci·node_modules에 기대면, npm ci가 흔들린 run에서는 알림도
      # 같이 죽는다. 이 스크립트는 node 하나로 돈다(의존성 0).
      #
      # 큐 마감(Drain)보다 **앞**에 둔다: 마감이 실패한 것까지 "집필 실패"로 알리면 이미 원고를
      # 받은 사용자에게 거짓 경보가 간다. 마감은 always()라 이 스텝 뒤에도 그대로 돈다.
      - name: 실패 알림 (트랙 봇)
        if: failure()
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 봇으로 보낼지는 이 job의 track이 정한다. 못 읽으면 메인봇(엔터)으로 가고
          # 본문에 "job 식별 실패"와 jobId가 적힌다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          # 입력값으로 이미 어느 원고인지 안다 - 대기열을 추측하지 않고 이 job만 집는다.
          FAILED_JOB_ID: ${{ inputs.job_id }}
          FAILED_WORKFLOW_FILE: job-revise.yml
        run: node scripts/notifyWorkflowFailure.mjs

      # job-research.yml과 같은 이유(2026-09-16) - always()로 돌아 큐 행을 마감하고 다음 대기
      # 항목을 스스로 깨운다. queue_id가 없으면(수동 실행) 조용히 아무것도 안 한다.
      - name: Drain pipeline queue
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:pipeline-drain -- "${{ inputs.queue_id }}" "${{ job.status }}"
