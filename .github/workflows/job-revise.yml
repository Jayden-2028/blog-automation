# 2026-09-15 - "수정 필요" 답장 피드백을 반영해 기준 원고를 다시 쓰는 단계
# (reviseArticleWithFeedback)를 GitHub Actions에서 실행한다. job-write.yml과 같은 이유
# (detached 프로세스가 GH Actions 러너에서 못 삶) - TelegramBot.triggerRevision override가
# 이 워크플로우를 workflow_dispatch로 발화한다(runTelegramUpdateCli.ts).
#
# claude -p + Skill(moai-marketer:content-blog, moai-writer:korean-humanize) 사용 -
# CLAUDE_CODE_OAUTH_TOKEN + 플러그인 설치 필요(job-write.yml과 동일).
#
# feedback은 workflow_dispatch string input으로 그대로 넘긴다(사용자가 텔레그램에 입력한 원문).

# 2026-09-16: 실행 순서는 GitHub concurrency 큐가 아니라 pipeline_dispatch_queue(Supabase, DB
# 큐)가 관리한다 - 근거는 job-research.yml 상단 주석 참고(같은 사고, 같은 수정).
name: job-revise

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      feedback:
        description: "사용자가 답장으로 보낸 수정 방향"
        required: true
        type: string
      queue_id:
        description: "pipeline_dispatch_queue.id (DB 큐를 거치지 않은 수동 실행이면 비워둔다)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

# job-research.yml과 같은 전역 그룹(heavy-pipeline). DB 큐가 정상 동작하는 한 절대 "대기 1개"를
# 넘지 않으므로 취소를 유발하지 않는 2차 안전망으로만 남겨둔다.
concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    # 2026-09-22: job-write와 같은 이유로 45분(수정 재작성도 같은 LLM 경로다).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI + moai-marketer 플러그인
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      - name: Run job:revise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 이미 승인·준비된 원고를 고친 경우, 재작성 뒤 job-publish-prepare.yml을 직접 발화해
          # 최종본을 다시 만든다(2026-09-19). 그 workflow_dispatch 호출에 토큰이 필요하다.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:revise -- "${{ inputs.job_id }}" "${{ inputs.feedback }}"

      # job-research.yml과 같은 이유(2026-09-16) - always()로 돌아 큐 행을 마감하고 다음 대기
      # 항목을 스스로 깨운다. queue_id가 없으면(수동 실행) 조용히 아무것도 안 한다.
      - name: Drain pipeline queue
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:pipeline-drain -- "${{ inputs.queue_id }}" "${{ job.status }}"
