# 2026-09-15 - "수정 필요" 답장 피드백을 반영해 기준 원고를 다시 쓰는 단계
# (reviseArticleWithFeedback)를 GitHub Actions에서 실행한다. job-write.yml과 같은 이유
# (detached 프로세스가 GH Actions 러너에서 못 삶) - TelegramBot.triggerRevision override가
# 이 워크플로우를 workflow_dispatch로 발화한다(runTelegramUpdateCli.ts).
#
# claude -p + Skill(moai-marketer:content-blog, moai-writer:korean-humanize) 사용 -
# CLAUDE_CODE_OAUTH_TOKEN + 플러그인 설치 필요(job-write.yml과 동일).
#
# feedback은 workflow_dispatch string input으로 그대로 넘긴다(사용자가 텔레그램에 입력한 원문).

name: job-revise

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      feedback:
        description: "사용자가 답장으로 보낸 수정 방향"
        required: true
        type: string

concurrency:
  group: job-revise-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI + moai-marketer 플러그인
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      - name: Run job:revise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run job:revise -- "${{ inputs.job_id }}" "${{ inputs.feedback }}"
