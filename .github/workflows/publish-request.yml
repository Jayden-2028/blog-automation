# 원고 뷰어의 발행 버튼 요청 1건을 처리한다(2026-10-06, TISTORY_AUTO_PUBLISH_DESIGN.md §5).
# Pages Function(functions/api/publish-request.ts)이 Access 토큰을 검증한 뒤 repository_dispatch로 깨운다.
#
# 채널에 따라 여기서 하는 일이 다르다(src/jobs/publishRequestCli.ts와 같은 갈래다):
#   · tistory  - 큐 등록 + 확인 메시지만(수 초). 실제 발행은 맥미니 폴러(job:tistory-poll)가 한다.
#                텔레그램 버튼과 같은 큐라 둘 다 눌러도 한 번만 올라간다.
#   · blogspot - **여기서 끝까지 올린다**. Blogger API는 토큰만 있으면 되므로 폴러가 필요 없다.
#
# ⚠️ 그래서 이 워크플로우는 발행 자격증명이 필요하다(2026-11-09). 11/05에 blogspot 채널을 얹으면서
# env 추가가 빠져 뷰어 발행이 전부 "BLOGGER_ENABLED=false"로 떨어졌다 - 같은 원고를 텔레그램 버튼으로
# 누르면 올라가는데(telegram-update.yml에는 블록이 있다) 뷰어에서만 실패했다. **아래 Blogger 블록은
# telegram-update.yml의 것과 같아야 한다** - 한쪽만 고치면 "버튼 두 개가 다르게 동작한다"가 또 생긴다.

name: publish-request

on:
  repository_dispatch:
    types: [publish_request]

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    # 5 -> 15(2026-11-09). 티스토리는 큐 등록뿐이라 5분이면 됐지만, blogspot 경로는 이 안에서
    # Blogger 업로드 + 이미지 Pages 재호스팅(wrangler 배포)까지 끝낸다. telegram-update.yml과 같은 값.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run job:publish-request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          PUBLISH_REQUEST_JSON: ${{ toJson(github.event.client_payload) }}
          # ── Blogger 발행(blogspot 채널) ─────────────────────────────────────────
          # telegram-update.yml의 같은 블록과 1:1로 맞춘다.
          BLOGGER_ENABLED: ${{ vars.BLOGGER_ENABLED }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 사용설명서 트랙(Korea Plain): 같은 구글 계정이라 refresh token은 그대로, blogId만 다르다.
          # **비어 있으면 사용설명서 글은 발행하지 않는다**(whynowissue로 폴백 금지).
          KSCENE_BLOGGER_BLOG_ID: ${{ secrets.KSCENE_BLOGGER_BLOG_ID || vars.KSCENE_BLOGGER_BLOG_ID }}
          # 발행 이미지 호스팅(전용 공개 Cloudflare Pages). **플래그만 넘기고 이걸 빠뜨리면 발행은 되지만
          # 본문 이미지가 Supabase 주소로 박혀 egress를 계속 먹는다** - 네 개가 한 묶음이다.
          KSCENE_IMAGES_PAGES_PROJECT: ${{ vars.KSCENE_IMAGES_PAGES_PROJECT }}
          KSCENE_IMAGES_BASE_URL: ${{ vars.KSCENE_IMAGES_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 사용설명서 글 공개 시 Bing URL 제출. 시크릿이 없으면 빈 값이라 기능이 조용히 꺼진다.
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: ${{ vars.BING_SITE_URL }}
          # 뷰어 경로는 호출 인자로 공개(asDraft:false)를 명시하므로 이 값에 영향받지 않는다.
          BLOGGER_PUBLISH_AS_DRAFT: ${{ vars.BLOGGER_PUBLISH_AS_DRAFT }}
          # 미설정이면 코드 기본값(20)을 쓴다.
          BLOGGER_DAILY_LIMIT: ${{ vars.BLOGGER_DAILY_LIMIT }}
        run: npm run job:publish-request
