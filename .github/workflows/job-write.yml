# 클라우드 이전 Phase 3 - 집필 단계(runWritingStage)를 GitHub Actions에서 실행한다.
# job-research.yml과 같은 이유(detached 프로세스가 GH Actions 러너에서 못 삶) - triggerWriting
# override가 이 워크플로우를 workflow_dispatch로 발화한다.
#
# claude -p + Skill(moai-marketer:content-blog) 사용 - CLAUDE_CODE_OAUTH_TOKEN + 플러그인 설치 필요
# (2026-09-13 스모크테스트로 신선한 CI 환경에서의 설치·로드 확인됨).
#
# 이미지 자동생성(ARTICLE_IMAGE_GENERATION)은 여전히 기본 false(보류) - OPENAI_API_KEY를 일부러
# 안 넣었다. 나중에 이미지 생성을 재개하면 이 워크플로우에 OPENAI_API_KEY secret과
# ARTICLE_IMAGE_GENERATION=true env를 추가해야 한다(잊지 말 것).
#
# 최대 소요 20분(WRITE_TIMEOUT_MS) - 타임아웃 여유를 넉넉히 둔다.
#
# 2026-09-14 첫 실측 실행에서 발견: 검수 단계(articleReviewChecks)가 NAVER 기준 출처를 다시
# 수집하는데(collectSourcesForJob) NAVER_CLIENT_ID/SECRET이 여기 빠져 있어서 전부 실패 ->
# 에이전트가 처음부터 다시 조사하느라 18분 41초나 걸렸다(보통 훨씬 빠름). 치명적은 아니었지만
# (자동 폴백으로 완료는 됨) 품질/속도 저하라 추가함.

# 2026-09-16: 실행 순서는 GitHub concurrency 큐가 아니라 pipeline_dispatch_queue(Supabase, DB
# 큐)가 관리한다 - 근거는 job-research.yml 상단 주석 참고(같은 사고, 같은 수정). 이 워크플로우도
# 항상 DB 큐를 통해서만 발화되고, 마지막 스텝이 큐 행을 마감하고 다음 대기 항목을 깨운다.
name: job-write

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      queue_id:
        description: "pipeline_dispatch_queue.id (DB 큐를 거치지 않은 수동 실행이면 비워둔다)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

# job-research.yml과 같은 전역 그룹(heavy-pipeline). DB 큐가 정상 동작하는 한 절대 "대기 1개"를
# 넘지 않으므로 취소를 유발하지 않는 2차 안전망으로만 남겨둔다.
concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI + moai-marketer 플러그인
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      - name: Run job:write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: npm run job:write -- "${{ inputs.job_id }}"

      # job-research.yml과 같은 이유(2026-09-16) - always()로 돌아 큐 행을 마감하고 다음 대기
      # 항목을 스스로 깨운다. queue_id가 없으면(수동 실행) 조용히 아무것도 안 한다.
      - name: Drain pipeline queue
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:pipeline-drain -- "${{ inputs.queue_id }}" "${{ job.status }}"
