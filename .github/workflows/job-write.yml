# 클라우드 이전 Phase 3 - 집필 단계(runWritingStage)를 GitHub Actions에서 실행한다.
# job-research.yml과 같은 이유(detached 프로세스가 GH Actions 러너에서 못 삶) - triggerWriting
# override가 이 워크플로우를 workflow_dispatch로 발화한다.
#
# claude -p + Skill(moai-marketer:content-blog) 사용 - CLAUDE_CODE_OAUTH_TOKEN + 플러그인 설치 필요
# (2026-09-13 스모크테스트로 신선한 CI 환경에서의 설치·로드 확인됨).
#
# 이미지 자동생성(ARTICLE_IMAGE_GENERATION)은 여전히 기본 false(보류) - OPENAI_API_KEY를 일부러
# 안 넣었다. 나중에 이미지 생성을 재개하면 이 워크플로우에 OPENAI_API_KEY secret과
# ARTICLE_IMAGE_GENERATION=true env를 추가해야 한다(잊지 말 것).
#
# 최대 소요 20분(WRITE_TIMEOUT_MS) - 타임아웃 여유를 넉넉히 둔다.
#
# 2026-09-14 첫 실측 실행에서 발견: 검수 단계(articleReviewChecks)가 NAVER 기준 출처를 다시
# 수집하는데(collectSourcesForJob) NAVER_CLIENT_ID/SECRET이 여기 빠져 있어서 전부 실패 ->
# 에이전트가 처음부터 다시 조사하느라 18분 41초나 걸렸다(보통 훨씬 빠름). 치명적은 아니었지만
# (자동 폴백으로 완료는 됨) 품질/속도 저하라 추가함.

# 2026-09-16: 실행 순서는 GitHub concurrency 큐가 아니라 pipeline_dispatch_queue(Supabase, DB
# 큐)가 관리한다 - 근거는 job-research.yml 상단 주석 참고(같은 사고, 같은 수정). 이 워크플로우도
# 항상 DB 큐를 통해서만 발화되고, 마지막 스텝이 큐 행을 마감하고 다음 대기 항목을 깨운다.
name: job-write

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "article_jobs.id (UUID)"
        required: true
        type: string
      queue_id:
        description: "pipeline_dispatch_queue.id (DB 큐를 거치지 않은 수동 실행이면 비워둔다)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

# job-research.yml과 같은 전역 그룹(heavy-pipeline). DB 큐가 정상 동작하는 한 절대 "대기 1개"를
# 넘지 않으므로 취소를 유발하지 않는 2차 안전망으로만 남겨둔다.
concurrency:
  group: heavy-pipeline
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  write:
    runs-on: ubuntu-latest
    # 2026-09-22: 25분 -> 45분. "낼 모레 50인데..." 원고가 25분 26초에 잘렸다 - 본문(4,072자)은
    # 이미 저장됐는데 상태 전환과 텔레그램 알림을 못 해서 job이 writing에 갇혔다. 사람이 보기에는
    # "원고가 안 온다"인데 실제로는 다 써져 있는, 알아채기 어려운 실패 방식이다.
    # 평소 5~13분이라 25분도 넉넉해 보였지만 긴 원고에서 넘겼다. 시간 초과는 LLM 호출값을 통째로
    # 버리므로 여유를 크게 두는 편이 싸다.
    #
    # 2026-11-15: 45분 -> 55분. WRITING_HUMANIZE_SKILL=skill이면 집필 호출 상한이 20 -> 28분이 된다(윤문 스킬 호출 +
    # 재검증). 집필 호출 앞뒤(조사 재수집·이미지 단계)를 더해도 55분 안이다. self 모드는 지금과 같이 20분이라 영향 없다.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI + moai-marketer 플러그인
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      # 2026-11-15 윤문 스킬 시험 운영(WRITING_HUMANIZE_SKILL=im-not-ai|skill일 때만 호출된다 - 기본은 자체 윤문).
      # continue-on-error인 이유: 설치가 실패해도 프롬프트가 rules/humanize.md 자체 윤문으로 폴백하므로
      # 집필·수정을 막을 이유가 없다. 다만 continue-on-error는 `gh run view --json jobs`의 conclusion을
      # success로 덮는다(2026-11-11 apt 장애 교훈) - 그래서 성공/실패를 echo 한 줄로 반드시 남긴다.
      # 로그에서 `[humanize-install]`을 찾는다.
      - name: Install humanize-korean 플러그인 (im-not-ai)
        continue-on-error: true
        run: |
          if claude plugin marketplace add https://github.com/epoko77-ai/im-not-ai.git \
            && claude plugin install humanize-korean@im-not-ai -y; then
            echo "[humanize-install] OK humanize-korean@im-not-ai"
          else
            echo "[humanize-install] FAILED - 스킬 모드면 자체 윤문(rules/humanize.md)으로 폴백한다"
            exit 1
          fi

      - name: Run job:write
        env:
          # 윤문 스킬 게이트(2026-11-15 시험 운영, src/config/humanizeMode.ts). 미설정·빈 값 = self(자체 윤문, 기본).
          # `im-not-ai`/`skill`이면 humanize-korean 스킬로 윤문하고 시간 상한이 28분이 된다. **롤백은 이 variable을 지우는 것**이다.
          WRITING_HUMANIZE_SKILL: ${{ vars.WRITING_HUMANIZE_SKILL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 트랙별 텔레그램 봇(멀티봇, notifications/telegramTracks.ts). job.metadata.track에 맞는 봇으로 알림이 나간다.
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 단계 통합(PIPELINE-MERGE-2026-10.md §2): 미설정·빈 값이면 켜짐(초안 승인 생략). 옛 2단계 흐름으로 되돌리려면
          # repo variable PIPELINE_SKIP_DRAFT_REVIEW=false. 켜져 있으면 write 직후 job-publish-prepare를 발화한다(actions: write).
          PIPELINE_SKIP_DRAFT_REVIEW: ${{ vars.PIPELINE_SKIP_DRAFT_REVIEW }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:write -- "${{ inputs.job_id }}"

      # 집필이 멈추면 원고도, 통합 알림도 오지 않는다 - 사용자는 Go를 누른 채 계속 기다린다.
      #
      # 2026-11-12: **이 워크플로가 실패하면 아무도 모른다.** 품질 게이트가 사람인 파이프라인에서
      # 알림이 오지 않는 실패는 파이프라인이 멈춘 것과 같다 - 2026-11-11 한효주 인물 백과 사고가
      # 그랬다(job-publish-prepare.yml이 #77에서 그 자리를 먼저 막았다).
      #
      # 왜 스텝 레벨 `if: failure()`인가: 그 사고의 run은 `npm run` 단계에 닿지도 못하고 apt에서
      # 죽었다 - CLI 안의 try/catch로는 잡을 수 없는 자리다.
      # 왜 node + .mjs인가: 알림이 npm ci·node_modules에 기대면, npm ci가 흔들린 run에서는 알림도
      # 같이 죽는다. 이 스크립트는 node 하나로 돈다(의존성 0).
      #
      # 큐 마감(Drain)보다 **앞**에 둔다: 마감이 실패한 것까지 "집필 실패"로 알리면 이미 원고를
      # 받은 사용자에게 거짓 경보가 간다. 마감은 always()라 이 스텝 뒤에도 그대로 돈다.
      # 2026-11-17: 조건이 `failure()`만이면 **시한 초과를 놓친다.** job 레벨 timeout-minutes로
      # 죽은 run은 failure가 아니라 **cancelled**로 끝나서 `if: failure()` 스텝이 건너뛰어진다.
      # 실측(run 43877069167, job-write): `Run job:write: cancelled` / `실패 알림: skipped` /
      # `Drain pipeline queue: success`(always()라서 돌았다). 그 run은 원고를 저장하고도 검수
      # 정규식 폭주로 55분을 먹고 죽었는데 사용자는 "준비 중입니다"를 마지막으로 계속 기다렸다.
      # cancelled()를 함께 걸어 시한 초과와 수동 취소도 알린다 - 조용한 정지가 가장 나쁘다.
      - name: 실패 알림 (트랙 봇)
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 봇으로 보낼지는 이 job의 track이 정한다. 못 읽으면 메인봇(엔터)으로 가고
          # 본문에 "job 식별 실패"와 jobId가 적힌다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          # 입력값으로 이미 어느 원고인지 안다 - 대기열을 추측하지 않고 이 job만 집는다.
          FAILED_JOB_ID: ${{ inputs.job_id }}
          FAILED_WORKFLOW_FILE: job-write.yml
          # failure와 cancelled(시한 초과·수동 취소)를 본문에서 구분한다.
          FAILED_JOB_STATUS: ${{ job.status }}
        run: node scripts/notifyWorkflowFailure.mjs

      # job-research.yml과 같은 이유(2026-09-16) - always()로 돌아 큐 행을 마감하고 다음 대기
      # 항목을 스스로 깨운다. queue_id가 없으면(수동 실행) 조용히 아무것도 안 한다.
      - name: Drain pipeline queue
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run job:pipeline-drain -- "${{ inputs.queue_id }}" "${{ job.status }}"
