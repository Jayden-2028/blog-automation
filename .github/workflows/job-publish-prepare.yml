# 클라우드 이전 Phase 4(마지막 조각) - approved job의 Blogspot 원고 준비 + 이미지 자동 생성 +
# manuscripts 페이지
# Cloudflare Pages 재배포(prepareApprovedManuscripts, 로컬 publish-poll이 10분 주기 폴링으로
# 하던 일).
#
# 폴링이 아니라 이벤트 기반이다: review:confirm(✅ 승인) 콜백이 telegram-update.yml 안에서
# triggerPublishPrepare()를 호출해 이 워크플로우를 바로 발화한다(TelegramBot.ts 참고). 10분 주기
# cron으로 돌리면 대기열이 비어 있어도 하루 144회 과금되는데(무료 한도 낭비), 승인은 텔레그램
# 버튼을 눌러야만 일어나는 사건이라 이벤트로 묶는 게 자연스럽고 더 싸다.
#
# job:publish-poll을 그대로 재사용한다(singleInstanceLock/jitter는 GH Actions 러너에선 해롭지
#않음 - 매번 새 러너라 락 파일이 항상 비어 있고, jitter는 그냥 몇십 초 더 걸릴 뿐).
#
# Cloudflare Pages 배포(deployManuscriptsPage.ts, npx wrangler pages deploy)에 필요한 시크릿
# 3종(CLOUDFLARE_API_TOKEN/ACCOUNT_ID/PAGES_PROJECT_NAME)이 필요 - 기존 Pages 배포용 토큰 재사용
# (Workers 토큰과 다름, 이미 로컬 .env에 있던 것 그대로).
#
# 2026-09-15 이미지 자동 생성(BLOGSPOT_ONLY_DESIGN.md §3): 원고가 확정된 직후 여기서 함께 돈다.
# **기본은 꺼져 있다** - 유료 API라 MANUSCRIPT_IMAGE_GENERATION vars가 "true"이고 OPENAI_API_KEY
# 또는 GEMINI_API_KEY secret이 있어야 실제로 호출한다. 비교 기간(IMAGE_AB_COMPARE)에는 프롬프트
# 1개당 2장을 만들므로 호출이 2배다 - 고른 뒤 vars에서 false로 내린다.

name: job-publish-prepare

on:
  workflow_dispatch: {}

concurrency:
  group: job-publish-prepare
  cancel-in-progress: false

# 헤드리스 claude 모델 고정(2026-09-30 사용자 결정) - 맥 .env의 CLAUDE_MODEL과 같은 값이어야 같은 원고가 나온다.
env:
  CLAUDE_MODEL: claude-sonnet-5-5

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 2026-09-18: 25분 -> 60분. 이 job이 하는 일이 늘었다 - 원고 1건당 배리에이션 생성(~3분) +
    # AI 이미지 생성(~1분) + **웹 검색 이미지 수집(~3분)** + **비전 검증(자리당 ~1분)**이고
    # maxJobsPerRun이 3이라 25분으로는 중간에 잘린다. heavy-pipeline과 다른 concurrency group이라
    # 오래 돌아도 조사·집필을 막지 않는다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `— 페이지 캡처` 자리를 Chromium으로 찍는다(capturePagesForJob.ts). 러너에는 한글 폰트가 없어
      # 설치하지 않으면 캡처 화면의 글자가 전부 네모(두부)로 찍힌다. (표 이미지 렌더는 2026-09-30 폐지했다.)
      - name: 한글 폰트 + Chromium 설치 (페이지 캡처용)
        # 정상 27초인 단계가 apt/네트워크 문제로 30분 넘게 멈춘 적이 있어(2026-10-08) 상한을 둔다.
        timeout-minutes: 8
        # **이 단계가 실패해도 원고 준비는 계속한다**(2026-11-11). 캡처는 `— 페이지 캡처` 자리를 채우는
        # 보조 기능이고, 설치가 안 되면 capturePagesForJob이 그 자리만 실패로 기록하고 넘어간다
        # (captureWithBrowser가 launch 실패를 {ok:false}로 돌려준다). 그런데 이 단계가 하드 실패라
        # **원고 재생성·뷰어 재배포·준비 완료 알림이 통째로 날아갔다**: 2026-11-11 한효주 인물 백과
        # 수정 반영이 발화한 run 43040388380이 `azure.archive.ubuntu.com` 이름풀이 실패(apt exit 100)로
        # 죽어, 수정본은 DB에만 남고 뷰어는 수정 전 본문을 계속 보여줬다. apt 한 번 흔들린 것이
        # 파이프라인 전체를 멈출 이유가 되면 안 된다.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npx playwright install --with-deps chromium

      - name: Install Claude Code CLI + moai-marketer 플러그인 (배리에이션 생성용)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add https://github.com/modu-ai/moai-cowork.git
          claude plugin install moai-marketer@moai-cowork -y

      - name: Run job:publish-poll
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 트랙별 텔레그램 봇(멀티봇, notifications/telegramTracks.ts). job.metadata.track에 맞는 봇으로 알림이 나간다.
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 웹 검색 이미지 후보(searchNaverImages, 2026-09-18). 빠지면 후보 없이 web_search만 돈다 -
          # 첫 재수집 배치에서 실제로 빠져 있어 후보가 전부 "Missing NAVER_CLIENT_ID"로 비었다(실측).
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 구글 이미지 색인을 네이버와 함께 쓴다(2026-09-21). 없으면 네이버 후보만으로 계속 돈다.
          # 구글 공식 API(Custom Search JSON)는 신규 발급이 막혀 Serper 중계를 쓴다.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # Serper 선지불 크레딧 게이지·소진 경보(2026-10-06). 비면 게이지·경보가 꺼진다 - cost.json을 쓰는
          # 워크플로 전부에 같은 값을 넣어야 게이지가 번갈아 사라지지 않는다.
          SERPER_CREDITS_PURCHASED: ${{ vars.SERPER_CREDITS_PURCHASED }}
          SERPER_CREDITS_PURCHASED_AT: ${{ vars.SERPER_CREDITS_PURCHASED_AT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUSCRIPT_IMAGE_GENERATION: ${{ vars.MANUSCRIPT_IMAGE_GENERATION }}
          IMAGE_AB_COMPARE: ${{ vars.IMAGE_AB_COMPARE }}
          # 이미지 기획 단계(2026-10-02). **기본이 켜짐**이라 변수를 안 넣어도 돈다.
          # 끄려면 variables에 IMAGE_PLANNING=false를 넣는다.
          IMAGE_PLANNING: ${{ vars.IMAGE_PLANNING }}
          # 단체 사진·2샷·합성컷 허용(2026-10-02, 기본 허용). 옛 규칙으로 되돌리려면 IMAGE_GROUP_SHOTS=false.
          IMAGE_GROUP_SHOTS: ${{ vars.IMAGE_GROUP_SHOTS }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          IMAGE_MAX_PER_ARTICLE: ${{ vars.IMAGE_MAX_PER_ARTICLE }}
          # Blogspot 자동 발행(2026-09-16 배선). prepareApprovedManuscripts가 원고 준비 직후
          # publishArticleToBlogspot을 부르는데, BLOGGER_ENABLED가 "true"가 아니면 그 함수가
          # 즉시 disabled로 돌아와 아무것도 안 한다 - 그래서 지금 이 줄들이 있어도 무해하다.
          # 켜는 것은 원고·이미지 품질을 확인한 뒤 사용자가 vars.BLOGGER_ENABLED를 true로 바꾸는
          # 시점이다(CLAUDE.md 승인 게이트). BLOGGER_PUBLISH_AS_DRAFT는 기본 true라 첫 단계는
          # 비공개 초안까지만 올라간다.
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 사용설명서 글 공개 시 Bing URL 제출(2026-10-27). 시크릿이 없으면 빈 값이라 기능이 조용히 꺼진다. 사이트 주소는 BING_SITE_URL(선택).
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: ${{ vars.BING_SITE_URL }}
          BLOGGER_ENABLED: ${{ vars.BLOGGER_ENABLED }}
          BLOGGER_PUBLISH_AS_DRAFT: ${{ vars.BLOGGER_PUBLISH_AS_DRAFT }}
          # 미설정이면 코드 기본값(20)을 쓴다. 조절은 vars에서 - 코드 수정·배포가 필요 없다.
          BLOGGER_DAILY_LIMIT: ${{ vars.BLOGGER_DAILY_LIMIT }}
        run: npm run job:publish-poll

      # **이 워크플로가 실패하면 아무도 모른다**(2026-11-11 한효주 인물 백과 사고). 품질 게이트가
      # 사람인 파이프라인이라 알림이 오지 않는 실패는 파이프라인이 멈춘 것과 같다 - 수정 반영
      # 알림은 "완료되면 발행 버튼과 함께 다시 보내드립니다"로 끝나 있었고, 사용자는 몇 시간 뒤
      # 뷰어를 직접 열어 보고서야 알았다. apt 단계는 continue-on-error로 내렸지만 **다른 이유로
      # 실패하면 여전히 조용하다**.
      #
      # 왜 워크플로 레벨인가: 그 run은 `npm run job:publish-poll`에 닿지도 못하고 죽었다 -
      # job:publish-poll 안의 try/catch로는 잡을 수 없는 자리다. 그래서 스텝 레벨 `if: failure()`다.
      #
      # 왜 tsx가 아니라 node + .mjs인가: 알림 경로가 npm ci·node_modules에 기대면, npm ci가
      # 흔들린 run에서는 알림도 같이 죽는다. 이 스크립트는 node 하나로 돈다(의존성 0).
      - name: 실패 알림 (트랙 봇)
        if: failure()
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어느 봇으로 보낼지는 대기 중인 job의 track이 정한다. 못 읽으면 메인봇(엔터)으로 가고
          # 본문에 "job 식별 실패"가 적힌다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          FAILED_WORKFLOW_FILE: job-publish-prepare.yml
        run: node scripts/notifyWorkflowFailure.mjs
