# 원고 뷰어 후보 이미지 클릭 교체 요청을 **큐에 쌓고, 큐를 비운다**(2026-10-07 VIEWER-REFINE §3, 2026-11-12 큐 전환).
#
# 발화: 뷰어 후보 클릭 -> Pages Function(functions/api/image-pick.ts, Access 토큰 검증) ->
#       repository_dispatch(image_pick). client_payload = { jobId, index, candidateNumber, fromUrl }.
#
# job이 둘이다:
#   enqueue - **concurrency 그룹이 없다. 항상 즉시 돈다.** 요청을 `image_pick_requests`에 한 행으로 적고
#             진행 중 표식(imagePickPendingAt)을 선기록한다.
#   apply   - `needs: enqueue` + **jobId별 concurrency**(cancel-in-progress: false). 그 job의 pending을
#             순서대로 전부 적용하고 **배포 한 번·알림 한 통**으로 끝낸다.
#
# 왜 이 모양인가(2026-11-12 실측 사고 두 단계):
#   ① 전에는 concurrency가 아예 없어 두 교체가 겹쳐 돌았고, 나중에 끝난 run이 **자기가 시작할 때 읽은
#      옛 상태로** 배포해 앞 교체를 덮었다(한효주 - 1번 누르고 3번을 눌렀더니 1번만 남았다. run 둘 다
#      "교체 완료"로 끝났다). `ArticleJobRepository.mergeMetadata`가 버전 검사 없는 read-modify-write라
#      DB의 metadata.images까지 되돌아갔다. PR #80이 jobId별 concurrency로 **2건은** 막았다.
#   ② 그런데 **3건 이상은 못 막았다**: GitHub은 그룹당 대기분을 하나만 들고 있어서, 한 건이 도는 중에
#      두 건이 더 들어오면 가운데 것이 조용히 취소된다(대기 중 취소는 스텝이 아예 돌지 않아 알림도 못 보낸다).
#      이제 요청은 **대기 중인 run이 아니라 DB에** 있으므로 대기분 취소가 무해하다 - 취소되는 건 apply뿐이고
#      뒤에 도는 apply가 남은 행을 같이 가져간다. 사용자가 몇 건을 눌러도 하나도 잃지 않는다.
#
# 배포 순서: 드레인은 한 건을 끝내고(DB 쓰기 완료) 다음 건의 loadJob을 하므로 read-modify-write 사이에
# 다른 쓰기가 끼지 않는다. 같은 jobId의 apply는 concurrency로 한 번에 하나만 돈다.
#
# **마이그레이션 적용 전에도 깨지지 않는다**: insert 스텝은 continue-on-error라 테이블이 없으면 실패해도
# apply가 그대로 돌고, 큐를 읽을 수 없으면 CLI가 옛 경로(payload 단건 처리 - 건당 배포·알림)로 떨어진다.
#
# 원고 준비(job-publish-prepare)는 다시 돌리지 않고 준비 완료 알림도 다시 보내지 않는다.
# repository_dispatch 전용이라 cron에 영향이 없다.

name: image-pick

on:
  repository_dispatch:
    types: [image_pick]

permissions:
  contents: read

jobs:
  # 요청 접수. **concurrency 그룹을 걸지 않는다** - 여기가 그룹 안에 들어가면 대기 중 취소로 요청 자체가
  # 사라져 큐에 쌓을 기회를 잃는다(그게 이번 개편의 전부다).
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 요청을 큐에 한 행으로 적는다. **테이블이 없으면(migration 미적용) 실패하지만 막지 않는다** -
      # 그 경우 apply가 payload 단건으로 옛 경로를 탄다. 네트워크가 흔들릴 수 있으니 --retry를 둔다.
      - name: 교체 요청 큐에 적기
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
          SLOT_INDEX: ${{ github.event.client_payload.index }}
          CANDIDATE_NUMBER: ${{ github.event.client_payload.candidateNumber }}
          FROM_URL: ${{ github.event.client_payload.fromUrl }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "jobId 형식 아님 - 건너뜀"; exit 0; }
          [[ "$SLOT_INDEX" =~ ^[0-9]{1,3}$ ]] || { echo "index 형식 아님 - 건너뜀"; exit 0; }
          [[ "$CANDIDATE_NUMBER" =~ ^[0-9]{1,2}$ ]] || { echo "candidateNumber 형식 아님 - 건너뜀"; exit 0; }
          body=$(jq -cn \
            --arg j "$JOB_ID" --argjson s "$SLOT_INDEX" --argjson c "$CANDIDATE_NUMBER" --arg f "${FROM_URL:-}" \
            '{job_id: $j, slot_index: $s, candidate_number: $c, from_url: $f}')
          curl -sS --fail-with-body --retry 4 --retry-delay 2 --retry-connrefused \
            -X POST "$SUPABASE_URL/rest/v1/image_pick_requests" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$body"
          echo "큐 적재 완료: $SLOT_INDEX번 <- 후보 $CANDIDATE_NUMBER"

      # 진행 중 표식을 **러너가 뜨자마자** 먼저 쓴다(2026-10-08). 체크아웃·npm ci에 20~40초가 걸리는데, 표식을 CLI 시작 때
      # 쓰면 그 사이 텔레그램 발행 콜백·폴러가 옛 이미지을 집어 간다. 실패해도 막지 않는다 - CLI가 시작할 때 다시 쓴다.
      - name: 진행 중 표식 선기록
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "jobId 형식 아님 - 건너뜀"; exit 0; }
          url="$SUPABASE_URL/rest/v1/article_jobs?id=eq.$JOB_ID"
          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          meta=$(curl -sf "${auth[@]}" "$url&select=metadata" | jq -c '.[0].metadata // {}')
          body=$(jq -cn --argjson m "$meta" --arg t "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" '{metadata: ($m + {imagePickPendingAt: $t})}')
          curl -sf -X PATCH "${auth[@]}" -H "Content-Type: application/json" -d "$body" "$url"
          echo "표식 기록 완료"

  # 큐를 비운다. **PR #80의 jobId별 concurrency를 그대로 유지한다** - 같은 원고의 드레인이 둘 겹치면
  # 다시 lost update가 난다. 대기 중 취소는 이제 무해하다(요청 행은 DB에 남아 있다).
  apply:
    needs: enqueue
    runs-on: ubuntu-latest
    # 한 run이 여러 건을 처리한다(상한 DEFAULT_MAX_ITEMS=12). 평시 1건이 30~60초라 넉넉히 둔다.
    timeout-minutes: 25
    concurrency:
      group: image-pick-${{ github.event.client_payload.jobId }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 1:2보다 긴 세로 후보를 자를 때만 쓴다(Chromium canvas + Claude로 자를 위치 판단). 드문 경로지만 러너가 매번 새로라
      # 미리 깔아 둔다 - 안 깔면 그 경우만 "자르지 못해 원본을 씁니다"로 떨어진다.
      #
      # **이 단계가 실패하거나 늦어도 교체는 계속한다**(2026-11-11 실측 사고). apt가 `azure.archive.ubuntu.com`을
      # 풀지 못하면 `playwright install --with-deps`가 20초 간격으로 계속 재시도한다 - 실패로 끝나지 않고 **버틴다.**
      # 그 바람에 job의 시한(당시 10분)을 이 단계가 다 먹고 `manuscripts:image-pick`이 skipped로 떨어져,
      # 뷰어에서 후보를 눌러도 이미지가 바뀌지 않았다(11/11 14:12~16:02 사이 10개 run 전부 cancelled).
      # 평시 run 전체가 70초쯤이므로 3분이면 넉넉하다. 못 깔면 긴 세로 이미지만 원본을 쓴다 -
      # cropTallImage는 launch 실패를 {ok:false}로, pickCropFocus는 claude 실행 실패를 focus 0으로 돌린다.
      - name: Chromium + Claude Code CLI 설치 (긴 세로 이미지 자르기용)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Run manuscripts:image-pick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          SERPER_CREDITS_PURCHASED: ${{ vars.SERPER_CREDITS_PURCHASED }}
          SERPER_CREDITS_PURCHASED_AT: ${{ vars.SERPER_CREDITS_PURCHASED_AT }}
          IMAGE_PICK_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run manuscripts:image-pick
