# 원고 뷰어 후보 이미지 클릭 교체 1건을 적용하고 원고 페이지를 다시 배포한다(2026-10-07, VIEWER-REFINE §3).
#
# 발화: 뷰어 후보 클릭 -> Pages Function(functions/api/image-pick.ts, Access 토큰 검증) ->
#       repository_dispatch(image_pick). client_payload = { jobId, index, candidateNumber, fromUrl }.
#
# 그 슬롯만 바꾼다: 후보 내려받기 -> Storage 업로드 -> job.metadata.images/imageCandidates -> manifest -> 배포.
# 원고 준비(job-publish-prepare)는 다시 돌리지 않고 준비 완료 알림도 다시 보내지 않는다. 다만 **교체가 끝나면(성공·실패
# 모두) 그 트랙 봇으로 한 통 알린다**(2026-11-05) - 교체가 1~2분 걸려 뷰어를 계속 새로고침해야 했다.
# repository_dispatch 전용이라 cron에 영향이 없다.
#
# **같은 원고의 교체는 한 번에 하나씩 돈다**(2026-11-12 실측 사고). 전에는 concurrency를 걸지 않았고, 주석에
# "DB는 둘 다 맞고 다음 배포에서 맞춰진다"고 적혀 있었는데 **둘 다 사실이 아니었다.**
#   - 한효주 원고에서 1번 자리를 누르고 반영 전에 3번을 눌렀더니 1번만 남았다. run 둘 다 "교체 완료"로 끝났다.
#   - 겹친 구간: 1번 run 01:13:49~01:15:09(배포 01:15:06), 3번 run 01:14:02~01:14:57(배포 01:14:54).
#     3번이 먼저 끝났고 1번이 **그 뒤에** 옛 상태로 배포해 3번 교체를 덮었다.
#   - DB도 같이 깨진다: `ArticleJobRepository.mergeMetadata`가 read-modify-write다(버전 검사 없음).
#     1번 run이 3번 run보다 **먼저 읽고 나중에 써서** metadata.images의 3번 자리를 되돌린다.
# 그래서 jobId별로 직렬화한다. 다른 원고끼리는 그대로 동시에 돈다.
#
# `cancel-in-progress: false`라 **먼저 온 요청을 죽이지 않고 끝난 뒤에 이어서** 돈다 - 사용자가 기다리는 동안
# 다음 자리를 눌러도 된다. 다만 GitHub은 그룹당 대기분을 **하나만** 들고 있어서, 한 건이 도는 중에 두 건이
# 더 들어오면 **가운데 것이 조용히 취소된다**(대기 중 취소는 스텝이 돌지 않아 알림도 못 보낸다).
# 그 자리는 다시 누르면 된다. 없애려면 요청을 DB 큐에 쌓고 한 run이 비울 때까지 돌려야 하는데,
# metadata read-modify-write를 원자적으로 바꾸는 migration이 필요해 별건으로 둔다.

name: image-pick

on:
  repository_dispatch:
    types: [image_pick]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 같은 원고의 교체는 줄을 세운다(위 머리글 참고). 그룹 키는 jobId라 다른 원고는 서로 안 기다린다.
    concurrency:
      group: image-pick-${{ github.event.client_payload.jobId }}
      cancel-in-progress: false
    steps:
      # 진행 중 표식을 **러너가 뜨자마자** 먼저 쓴다(2026-10-08). 체크아웃·npm ci에 20~40초가 걸리는데, 표식을 CLI 시작 때
      # 쓰면 그 사이 텔레그램 발행 콜백·폴러가 옛 이미지을 집어 간다. 실패해도 막지 않는다 - CLI가 시작할 때 다시 쓴다.
      - name: 진행 중 표식 선기록
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "jobId 형식 아님 - 건너뜀"; exit 0; }
          url="$SUPABASE_URL/rest/v1/article_jobs?id=eq.$JOB_ID"
          auth=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          meta=$(curl -sf "${auth[@]}" "$url&select=metadata" | jq -c '.[0].metadata // {}')
          body=$(jq -cn --argjson m "$meta" --arg t "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" '{metadata: ($m + {imagePickPendingAt: $t})}')
          curl -sf -X PATCH "${auth[@]}" -H "Content-Type: application/json" -d "$body" "$url"
          echo "표식 기록 완료"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 1:2보다 긴 세로 후보를 자를 때만 쓴다(Chromium canvas + Claude로 자를 위치 판단). 드문 경로지만 러너가 매번 새로라
      # 미리 깔아 둔다 - 안 깔면 그 경우만 "자르지 못해 원본을 씁니다"로 떨어진다.
      #
      # **이 단계가 실패하거나 늦어도 교체는 계속한다**(2026-11-11 실측 사고). apt가 `azure.archive.ubuntu.com`을
      # 풀지 못하면 `playwright install --with-deps`가 20초 간격으로 계속 재시도한다 - 실패로 끝나지 않고 **버틴다.**
      # 그 바람에 job의 10분 시한을 이 단계가 다 먹고 `manuscripts:image-pick`이 skipped로 떨어져,
      # 뷰어에서 후보를 눌러도 이미지가 바뀌지 않았다(11/11 14:12~16:02 사이 10개 run 전부 cancelled).
      # 평시 run 전체가 70초쯤이므로 3분이면 넉넉하다. 못 깔면 긴 세로 이미지만 원본을 쓴다 -
      # cropTallImage는 launch 실패를 {ok:false}로, pickCropFocus는 claude 실행 실패를 focus 0으로 돌린다.
      - name: Chromium + Claude Code CLI 설치 (긴 세로 이미지 자르기용)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Run manuscripts:image-pick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SOCIAL_TELEGRAM_BOT_TOKEN }}
          SOCIAL_TELEGRAM_CHAT_ID: ${{ secrets.SOCIAL_TELEGRAM_CHAT_ID }}
          KSCENE_TELEGRAM_BOT_TOKEN: ${{ secrets.KSCENE_TELEGRAM_BOT_TOKEN }}
          KSCENE_TELEGRAM_CHAT_ID: ${{ secrets.KSCENE_TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          SERPER_CREDITS_PURCHASED: ${{ vars.SERPER_CREDITS_PURCHASED }}
          SERPER_CREDITS_PURCHASED_AT: ${{ vars.SERPER_CREDITS_PURCHASED_AT }}
          IMAGE_PICK_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run manuscripts:image-pick
