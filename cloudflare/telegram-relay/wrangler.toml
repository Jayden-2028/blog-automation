name = "blog-automation-telegram-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
GITHUB_OWNER = "Jayden-2028"
GITHUB_REPO = "blog-automation"

# secrets(TELEGRAM_WEBHOOK_SECRET, GH_DISPATCH_TOKEN, TELEGRAM_BOT_TOKEN)은 평문으로 여기 안 둔다.
# `echo -n "<값>" | wrangler secret put <이름>`으로 별도 등록한다(docs/ai-handoff/CLOUD_MIGRATION.md
# Phase 3 참고). 이 환경(비대화형 셸)에서 파이프 없이 `wrangler secret put`을 치면 빈 값이 저장된
# 채 "Success"가 찍히니 반드시 파이프로 넣을 것(09-16 실측 사고).
# TELEGRAM_BOT_TOKEN(2026-09-16 추가)은 버튼 클릭 즉시 "접수됨" 토스트(answerCallbackQuery)에만
# 쓴다 - 없어도 릴레이 자체는 동작하고 토스트만 생략된다(src/index.ts 참고).

# 2026-10-05 개편(RESTRUCTURE-PLAN-2026-10.md §2.1): 무료 플랜 cron 한도(5개)가 꽉 차서, 키워드 수집
# 시각 5개를 cron 표현식 하나에 묶고 Worker가 발화 시(UTC hour)로 워크플로를 고른다
# (src/schedule.ts의 resolveScheduled). 5개 -> 3개로 줄어 이후 트랙이 늘어도 여유가 있다.
#   0 0,4,9,11,12 * * *  ->  09/13/18시 엔터(오전/오후/저녁 회차), 20시 사회, 21시 사용설명서(3순위)
# **src/schedule.ts의 KEYWORD_CRON과 문자열이 정확히 같아야 한다** - 다르면 "알 수 없는 cron"으로 실패한다.
# (이전: 사회 18시 / 엔터 19시 / 커뮤니티 20시, 2026-10-01~10-05)
[triggers]
# 09:30 KST(00:30 UTC)에 Search Console 성과 수집(2026-09-21). 월요일 10:00 KST는 색인 건강 점검.
crons = ["0 0,4,9,11,12 * * *", "30 0 * * *", "0 1 * * 1"]

# 2026-10-02: 로그를 보관한다. 이게 꺼져 있어서 엔터·커뮤니티 cron이 이틀 동안 안 돌았는데도
# "Worker가 깨어났는지, dispatch가 실패했는지"를 사후에 볼 방법이 없었다(대시보드의 Live logs는
# 보고 있는 동안만 보인다). src/index.ts의 scheduled()가 매 호출을 [cron] 한 줄로 남긴다.
[observability]
enabled = true
