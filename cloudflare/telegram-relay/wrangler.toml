name = "blog-automation-telegram-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
GITHUB_OWNER = "Jayden-2028"
GITHUB_REPO = "blog-automation"

# secrets(TELEGRAM_WEBHOOK_SECRET, GH_DISPATCH_TOKEN, TELEGRAM_BOT_TOKEN)은 평문으로 여기 안 둔다.
# `echo -n "<값>" | wrangler secret put <이름>`으로 별도 등록한다(docs/ai-handoff/CLOUD_MIGRATION.md
# Phase 3 참고). 이 환경(비대화형 셸)에서 파이프 없이 `wrangler secret put`을 치면 빈 값이 저장된
# 채 "Success"가 찍히니 반드시 파이프로 넣을 것(09-16 실측 사고).
# TELEGRAM_BOT_TOKEN(2026-09-16 추가)은 버튼 클릭 즉시 "접수됨" 토스트(answerCallbackQuery)에만
# 쓴다 - 없어도 릴레이 자체는 동작하고 토스트만 생략된다(src/index.ts 참고).

# 2026-09-16: 키워드 수집 3종을 여기서 깨운다(src/index.ts의 scheduled() 핸들러 + 상단 주석 참고 -
# GitHub Actions 네이티브 schedule: 트리거가 매일 4~5시간씩 지연되던 문제의 대체).
# 2026-10-01 사용자 결정으로 저녁대로 옮겼다: 사회·경제 18:00 / 연예·OTT 19:00 / 커뮤니티 20:00(KST).
# (2026-09-18~10-01은 08:00 / 12:00 / 18:00이었다.)
# 아래 값은 그것을 UTC로 바꾼 것이다(KST = UTC+9). 저녁대라 UTC 날짜가 갈리지 않는다
# (18:00 KST = 같은 날 09:00 UTC) - 전에 08:00 KST가 전날 23:00 UTC였던 것과 다르다.
# src/index.ts의 SCHEDULED_WORKFLOWS와 **반드시 같이 바꿀 것** - cron 문자열이 그쪽 map의 키라,
# 한쪽만 고치면 "알 수 없는 cron 표현식"으로 조용히 아무 일도 안 일어난다.
[triggers]
# 09:30 KST(00:30 UTC)에 Search Console 성과 수집을 하나 더 돌린다(2026-09-21). 키워드 수집과
# 겹치지 않는 시간대로 뒀다 - 읽기만 하는 가벼운 작업이라 순서 의존도 없다.
crons = ["0 9 * * *", "0 10 * * *", "0 11 * * *", "30 0 * * *", "0 1 * * 1"]
